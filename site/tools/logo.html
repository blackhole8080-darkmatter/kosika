<!doctype html>
<!-- The source of media/kosika-logo.png and media/kosika-mark.png.
     Rendered by tools/make-logo.mjs; open it in a browser to see the lockup. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Figtree; src: url("../fonts/Figtree.ttf") format("truetype"); font-weight: 300 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06070d; }
  body { display: grid; gap: 40px; padding: 40px; font-family: Figtree, system-ui, sans-serif; }

  .lockup {
    width: 1080px; height: 340px; display: flex; align-items: center; gap: 48px;
    padding: 0 68px; border-radius: 40px; position: relative; overflow: hidden;
    background: #0a0c16;
    box-shadow: inset 0 0 0 1px rgba(160, 175, 255, .14);
  }
  .lockup::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(52% 90% at 12% 50%, rgba(139, 124, 246, .22), transparent 72%),
      radial-gradient(46% 80% at 88% 120%, rgba(245, 180, 92, .16), transparent 70%);
  }
  .lockup > * { position: relative; }
  .lockup img.mark { width: 196px; height: 196px; border-radius: 48px; flex: none;
    background: #05060b; box-shadow: inset 0 0 0 1px rgba(160, 175, 255, .16), 0 0 90px -18px rgba(139, 124, 246, .75); }
  .lockup .names { display: grid; gap: 14px; }
  .lockup .name { font-size: 132px; font-weight: 800; letter-spacing: -.045em; line-height: .88; color: #eef1fb; }
  .lockup .sub { font: 600 20px/1 ui-monospace, Consolas, monospace; letter-spacing: .34em; text-transform: uppercase; color: #f5b45c; }

  .tile { width: 512px; height: 512px; border-radius: 114px; background: #0a0c16; display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px rgba(160, 175, 255, .14); }
  .tile img { width: 344px; height: 344px; }
</style>
</head>
<body>
  <div class="lockup" id="lockup">
    <img class="mark" src="../assets/mark.svg" alt="">
    <div class="names">
      <div class="name">Kosika</div>
      <div class="sub">Studio · agents that prove their work</div>
    </div>
  </div>

  <div class="tile" id="tile"><img src="../assets/mark.svg" alt="Kosika"></div>
</body>
</html>
