name: Kosika manifest check

on:
  push:
    paths:
      - ".github/workflows/kosika-manifest-check.yml"
      - "examples/**"
      - "kosika/**"
      - "pyproject.toml"
      - "**/*.kos"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/kosika-manifest-check.yml"
      - "examples/**"
      - "kosika/**"
      - "pyproject.toml"
      - "**/*.kos"
      - "tests/**"

permissions:
  contents: read

jobs:
  quality:
    name: Quality and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python quality and test tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.11.13
          mypy==1.15.0
          coverage==7.6.10
          pytest==8.3.5

      - name: Install Kosika and its dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Lint Python
        run: ruff check .

      - name: Type-check Python
        run: mypy kosika tests --show-error-codes

      - name: Check pinned MCP manifest
        run: >-
          kosika manifest check
          examples/mcp_manifest.json
          --mcp-server examples/mcp_host_server.py
          --json

      - name: Run the complete test corpus with coverage
        run: coverage run --branch -m pytest -v

      - name: Report coverage
        run: |
          coverage report -m --fail-under=0
          coverage xml -o coverage.xml
          {
            echo "## Kosika test coverage"
            echo
            echo '```text'
            coverage report -m --fail-under=0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce minimum coverage
        run: coverage report --fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosika-coverage
          path: coverage.xml
          if-no-files-found: error

  compatibility:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Kosika and pytest
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==8.3.5
          -e .

      - name: Run the complete test corpus
        run: python -m pytest -q

  distribution:
    name: Built distribution smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build

      - name: Install the wheel in an isolated environment
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl

      - name: Exercise installed CLI, LSP, and replay
        run: |
          smoke="$RUNNER_TEMP/kosika-smoke"
          mkdir -p "$smoke"
          cp examples/hello_world.kos "$smoke/"
          cd "$smoke"
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika" --help
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika-lsp" --version
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika" check hello_world.kos
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika" run hello_world.kos --trace trace.jsonl
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika" replay trace.jsonl
