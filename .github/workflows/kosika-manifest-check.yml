name: Kosika checks

# Runs on the branches that are shared (studio and master), on pull requests
# into them, and by hand. Work-in-progress branches are checked when a pull
# request is opened for them, not on every push.

on:
  push:
    branches: [studio, master]
    paths:
      - ".github/workflows/kosika-manifest-check.yml"
      - "examples/**"
      - "kosika/**"
      - "native/**"
      - "std/**"
      - "pyproject.toml"
      - "**/*.kos"
      - "tests/**"
  pull_request:
    branches: [studio, master]
    paths:
      - ".github/workflows/kosika-manifest-check.yml"
      - "examples/**"
      - "kosika/**"
      - "native/**"
      - "std/**"
      - "pyproject.toml"
      - "**/*.kos"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: kosika-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and MCP manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kosika and the quality tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.11.13
          mypy==1.15.0
          -e .

      # Only mistakes that break a program stop the run: syntax errors and
      # names that are never defined.
      - name: Find Python errors
        run: ruff check . --select E9,F63,F7,F82 --output-format github

      # Formatting, import order, unused imports and types are reported in
      # the run's summary but do not fail it. The code base has not been put
      # through the formatter yet; once it has, these can stop the run too.
      - name: Report style and types
        run: |
          {
            echo "## Style and types (reported, not enforced)"
            echo
            echo '```text'
            ruff format --check . 2>&1 | tail -n 1 || true
            ruff check . --statistics 2>&1 || true
            mypy kosika tests --show-error-codes 2>&1 | tail -n 1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check pinned MCP manifest
        run: >-
          kosika manifest check
          examples/mcp_manifest.json
          --mcp-server examples/mcp_host_server.py
          --json

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The suite is about 23 minutes on one core; spread over the runner's
    # cores it takes about 8 minutes. Measuring coverage makes it
    # several times slower, so coverage is measured only on a run started
    # by hand (Actions, Kosika checks, Run workflow).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage: wanted
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    env:
      COVERAGE: ${{ matrix.coverage == 'wanted' && github.event_name == 'workflow_dispatch' }}
    steps:
      # Windows runners turn line endings into CRLF on checkout, which makes
      # files differ from what the tests expect. Keep them as committed.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Kosika and pytest
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==8.3.5
          pytest-xdist==3.6.1
          pytest-cov==6.0.0
          -e .

      - name: Run the complete test corpus
        if: env.COVERAGE != 'true'
        run: python -m pytest -q -n auto --dist worksteal

      - name: Run the complete test corpus with coverage
        if: env.COVERAGE == 'true'
        run: >-
          python -m pytest -q -n auto --dist worksteal
          --cov=kosika --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=term:skip-covered

      - name: Report coverage
        if: env.COVERAGE == 'true'
        run: |
          {
            echo "## Kosika test coverage"
            echo
            echo '```text'
            python -m coverage report --skip-covered | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: env.COVERAGE == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: kosika-coverage
          path: coverage.xml
          if-no-files-found: warn

  distribution:
    name: Built distribution smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build

      - name: Install the wheel in an isolated environment
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl

      - name: Exercise installed CLI, LSP, and replay
        run: |
          smoke="$RUNNER_TEMP/kosika-smoke"
          mkdir -p "$smoke"
          cp examples/hello_world.kos "$smoke/"
          cd "$smoke"
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika" --help
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika-lsp" --version
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika" check hello_world.kos
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika" run hello_world.kos --trace trace.jsonl
          "$GITHUB_WORKSPACE/.venv-smoke/bin/kosika" replay trace.jsonl
