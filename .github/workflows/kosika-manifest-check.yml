name: Kosika manifest check

on:
  push:
    paths:
      - ".github/workflows/kosika-manifest-check.yml"
      - "examples/**"
      - "kosika/**"
      - "pyproject.toml"
      - "**/*.syn"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/kosika-manifest-check.yml"
      - "examples/**"
      - "kosika/**"
      - "pyproject.toml"
      - "**/*.syn"
      - "tests/**"

permissions:
  contents: read

jobs:
  manifest-check:
    name: Check pinned MCP manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python quality tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.11.13
          mypy==1.15.0
          coverage==7.6.10

      - name: Check Python formatting
        run: ruff format --check .

      - name: Lint Python
        run: ruff check .

      - name: Type-check Python
        run: mypy kosika tests --show-error-codes

      - name: Check pinned MCP manifest
        run: >-
          python -m kosika.cli manifest check
          examples/mcp_manifest.json
          --mcp-server examples/mcp_host_server.py
          --json

      - name: Run Kosika unit tests with coverage
        run: >-
          coverage run --branch
          -m unittest discover -s tests -v

      - name: Report coverage
        run: |
          coverage report -m --fail-under=0
          coverage xml -o coverage.xml
          {
            echo "## Kosika test coverage"
            echo
            echo '```text'
            coverage report -m --fail-under=0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce minimum coverage
        run: coverage report --fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosika-coverage
          path: coverage.xml
          if-no-files-found: error
