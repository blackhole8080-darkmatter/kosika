<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Kosika — grid · dark</title>
<style>
html,body{margin:0;height:100%;background:#0b0c10;color:#cbd5e1;font-family:system-ui,sans-serif}
header{padding:24px 32px;border-bottom:1px solid #1e293b}
h1{margin:0;font-size:20px;letter-spacing:-0.02em}
p.sub{margin:6px 0 0;font-size:13px;color:#64748b}
main{height:calc(100% - 140px);display:grid;place-items:center;position:relative}
svg{max-width:95vw;max-height:82vh;width:960px;height:640px;display:block}
footer{padding:16px 32px;border-top:1px solid #1e293b;display:flex;gap:16px;align-items:center;justify-content:space-between}
button{background:#1e293b;border:1px solid #334155;color:#cbd5e1;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
button:hover{background:#334155}
button:disabled{opacity:0.5;cursor:not-allowed}
label{font-size:12px;color:#64748b;display:flex;align-items:center;gap:8px}
input[type=range]{flex:1}
.badge{display:inline-block;padding:2px 8px;border:1px solid #334155;border-radius:10px;font-size:11px;margin-right:8px}
.controls{display:flex;gap:10px;align-items:center}
.playing .pause{display:none}
.paused .play{display:none}
</style>
</head>
