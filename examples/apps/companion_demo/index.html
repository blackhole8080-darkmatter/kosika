<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosi</title>
<style>
  :root { --ink:#f4f1ea; --soft:#a29a8b; --bg:#141210; --panel:#1d1a16; --line:#2d2822; --amber:#e0a458; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:30px 20px 150px; }
  h1 { font-size:21px; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub { color:var(--soft); font-size:13px; margin:0 0 26px; max-width:64ch; }
  .sub code { color:#cfc6b6; }
  .turn { display:flex; gap:12px; margin:0 0 20px; }
  .who { flex:none; width:44px; padding-top:4px; color:var(--soft); font-size:11px;
         text-transform:uppercase; letter-spacing:.08em; }
  .bubble { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
            padding:13px 15px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .turn.you .bubble { background:none; border-color:transparent; padding:2px 0; color:#ded6c7; }
  .meta { margin-top:10px; color:var(--soft); font-size:12px; white-space:normal; }
  .meta b { color:#cfc6b6; font-weight:600; }
  .art { margin-top:14px; }
  .art iframe { width:100%; height:560px; border:0; border-radius:12px; background:#fff; }
  .wait { color:var(--soft); font-size:13px; }
  form { position:fixed; inset:auto 0 0 0; padding:16px 20px 22px;
         background:linear-gradient(180deg,transparent,var(--bg) 34%); }
  .bar { max-width:880px; margin:0 auto; display:flex; gap:10px; }
  input { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:13px 15px; color:var(--ink); font:inherit; outline:none; }
  input:focus { border-color:#4a4338; }
  button { background:var(--amber); color:#1a1410; border:0; border-radius:12px;
           padding:0 20px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
</style>
</head>
<body>
<main>
  <h1>Kosi</h1>
  <p class="sub">Every message is one real run of <code>examples/agents/companion/main.kos</code> — no script.
     Try <em>remember that my locker is 14</em>, then <em>what is my locker?</em>,
     then <em>draw me a diagram of a bicycle</em>.</p>
  <div id="turns"></div>
</main>
<form id="say">
  <div class="bar">
    <input id="text" autocomplete="off" placeholder="remember that my locker is 14" autofocus>
    <button id="send" type="submit">Say</button>
  </div>
</form>
<script>
const turns = document.getElementById('turns');
const form = document.getElementById('say');
const input = document.getElementById('text');
const send = document.getElementById('send');

const escape = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function turn(who, html, cls) {
  const row = document.createElement('div');
  row.className = 'turn ' + (cls || '');
  row.innerHTML = '<div class="who">' + who + '</div><div class="bubble">' + html + '</div>';
  turns.appendChild(row);
  row.scrollIntoView({behavior: 'smooth', block: 'end'});
  return row;
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const said = input.value.trim();
  if (!said) return;
  input.value = '';
  send.disabled = true;
  turn('you', escape(said), 'you');
  const waiting = turn('kosi', '<span class="wait">thinking…</span>');

  try {
    const back = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: said})
    });
    const answer = await back.json();
    const bubble = waiting.querySelector('.bubble');
    bubble.textContent = answer.text || '(no words)';
    if (answer.embed) {
      const art = document.createElement('div');
      art.className = 'art';
      art.innerHTML = answer.embed;          // Designs' own fragment, as it gave it
      bubble.appendChild(art);
    }
    const bits = [];
    if (answer.kind) bits.push('drawing: <b>' + escape(answer.kind) + '</b>');
    if (answer.title) bits.push(escape(answer.title));
    if (answer.model) bits.push('model <b>' + escape(answer.model) + '</b>');
    bits.push(escape(answer.seconds) + ' s');
    if (answer.problems && answer.problems.length) bits.push(answer.problems.length + ' problems');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = bits.join(' · ');
    bubble.appendChild(meta);
  } catch (error) {
    waiting.querySelector('.bubble').textContent = 'I could not reach Kosika: ' + error;
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
