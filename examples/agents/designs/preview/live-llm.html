<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kosika Designs</title><style>:root{--bg:#0b0a1f;--ink:#ece9ff;--soft:#9d98c8;--amber:#ffb547;--line:#fff;--line2:rgba(255,255,255,.5)}@media (prefers-color-scheme: light){:root{--bg:#fbfaff;--ink:#16133a;--soft:#5d5888;--amber:#b56a00;--line:#000;--line2:rgba(0,0,0,.45)}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:980px;margin:0 auto;padding:28px 16px 48px}.brand{color:var(--amber);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11px}.ask{color:var(--soft);font-size:14px;margin:2px 0 14px}h1{font-size:24px;font-weight:650;margin:0 0 6px}.think{font:13px ui-monospace,Consolas,monospace;color:var(--amber);min-height:20px;margin:0 0 10px}.think:before{content:'\25CF  ';animation:blink 1s infinite}body.done .think:before{content:'\2713  ';animation:none}svg{width:100%;height:auto;display:block}.hud{font:600 12px ui-monospace,Consolas,monospace;color:var(--amber);min-height:20px;margin:4px 0 10px}ol{list-style:none;margin:0;padding:0}.say{display:none;gap:12px;padding:6px 8px;border-radius:8px;cursor:default}.say.shown{display:flex}.say b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--amber);border:1.5px solid var(--amber)}.say.now b,.say:hover b,.say:focus b{background:var(--amber);color:var(--bg)}.say:hover,.say:focus{outline:none;background:rgba(255,181,71,.08)}.bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px}button{font:600 12px system-ui;color:var(--ink);background:none;border:1px solid var(--line2);border-radius:999px;padding:5px 12px;cursor:pointer}.bit{opacity:0;transition:opacity .35s}.bit.shown{opacity:1}.part rect,.ring>circle:first-child{fill:none;stroke:var(--line);stroke-width:1.4;transition:stroke .2s,stroke-width .2s}.part.shown rect,.part.shown>circle:first-child,.sq.shown rect,#spiral.shown{stroke-dasharray:1;animation:pen .7s ease-out both}.label{fill:var(--ink);font:600 14px system-ui,sans-serif;text-anchor:middle}.note{fill:var(--soft);font:12px system-ui,sans-serif;text-anchor:middle}.leader{fill:none;stroke:var(--line2);stroke-width:1}.dot{fill:var(--line)}.wire{fill:none;stroke:var(--line2);stroke-width:1.3}.head{fill:var(--line2)}.pulse{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-dasharray:5 17;opacity:0}.linklabel{fill:var(--soft);font:12px system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px}.sq rect{fill:none;stroke:var(--line);stroke-width:1.2}.side{fill:var(--soft);font-weight:600;text-anchor:middle;font-family:system-ui,sans-serif}#spiral{fill:none;stroke:var(--line);stroke-width:2.4}#origin circle{fill:var(--amber)}.on rect,.on>circle:first-child,.sq.on rect{stroke:var(--amber);stroke-width:2.6}.on .label{fill:var(--amber)}#spiral.on{stroke:var(--amber);stroke-width:3.4}.link.on .wire{stroke:var(--amber)}.link.on .pulse{opacity:1;animation:run 1s linear infinite}.ref{margin:16px 0 0}.ref img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;transition:outline .2s}.ref.on img{outline:3px solid var(--amber)}.credit{color:var(--soft);font-size:12px;margin-top:6px}.credit a{color:var(--amber)}@keyframes pen{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes run{to{stroke-dashoffset:-22}}@keyframes blink{50%{opacity:.25}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></head><body><main><div class="brand">Kosika Designs</div><div class="ask">&#8220;how does an LLM work&#8221;</div><h1>How a large language model writes</h1><div class="think" id="think" data-lines="[&quot;Reading the request.&quot;,&quot;Choosing a flow layout for 7 parts and 7 links.&quot;,&quot;Drawing it, one step at a time.&quot;]" data-done="Done. Hover a step to mark it again."></div><svg viewBox="0 0 860 360" role="img" aria-label="How a large language model writes"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs><g class="link bit" id="l-prompt-tok" data-a="p-prompt" data-b="p-tok"><path class="wire" d="M158.5 90.0 C209.6 90.0 209.6 90.0 260.7 90.0" marker-end="url(#arrow)"/><path class="pulse" d="M158.5 90.0 C209.6 90.0 209.6 90.0 260.7 90.0"/></g><g class="link bit" id="l-tok-emb" data-a="p-tok" data-b="p-emb"><path class="wire" d="M380.3 90.0 C425.9 90.0 425.9 90.0 471.5 90.0" marker-end="url(#arrow)"/><path class="pulse" d="M380.3 90.0 C425.9 90.0 425.9 90.0 471.5 90.0"/></g><g class="link bit" id="l-emb-att" data-a="p-emb" data-b="p-att"><path class="wire" d="M599.5 90.0 C634.6 90.0 634.6 90.0 669.7 90.0" marker-end="url(#arrow)"/><path class="pulse" d="M599.5 90.0 C634.6 90.0 634.6 90.0 669.7 90.0"/></g><g class="link bit" id="l-att-mlp" data-a="p-att" data-b="p-mlp"><path class="wire" d="M752.5 118.0 C752.5 178.0 752.5 178.0 752.5 238.0" marker-end="url(#arrow)"/><path class="pulse" d="M752.5 118.0 C752.5 178.0 752.5 178.0 752.5 238.0"/><text class="linklabel" x="752.5" y="171.0">x N blocks</text></g><g class="link bit" id="l-mlp-head" data-a="p-mlp" data-b="p-head"><path class="wire" d="M682.1 270.0 C644.9 270.0 644.9 270.0 607.7 270.0" marker-end="url(#arrow)"/><path class="pulse" d="M682.1 270.0 C644.9 270.0 644.9 270.0 607.7 270.0"/></g><g class="link bit" id="l-head-pick" data-a="p-head" data-b="p-pick"><path class="wire" d="M471.3 270.0 C425.7 270.0 425.7 270.0 380.1 270.0" marker-end="url(#arrow)"/><path class="pulse" d="M471.3 270.0 C425.7 270.0 425.7 270.0 380.1 270.0"/><text class="linklabel" x="425.7" y="263.0">softmax</text></g><g class="link bit" id="l-pick-tok" data-a="p-pick" data-b="p-tok"><path class="wire" d="M322.5 242.0 C412.5 182.0 412.5 182.0 322.5 122.0" marker-end="url(#arrow)"/><path class="pulse" d="M322.5 242.0 C412.5 182.0 412.5 182.0 322.5 122.0"/><text class="linklabel" x="390.0" y="175.0">append, repeat</text></g><g class="part bit" id="p-prompt"><rect pathLength="1" x="62.5" y="68.0" width="90.0" height="44" rx="12"/><text class="label" x="107.5" y="95.0">Prompt</text><text class="note" x="107.5" y="128.0">your text</text></g><g class="part bit" id="p-tok"><rect pathLength="1" x="270.7" y="68.0" width="103.6" height="44" rx="12"/><text class="label" x="322.5" y="95.0">Tokenizer</text><text class="note" x="322.5" y="128.0">text to token ids</text></g><g class="part bit" id="p-emb"><rect pathLength="1" x="481.5" y="68.0" width="112.0" height="44" rx="12"/><text class="label" x="537.5" y="95.0">Embeddings</text><text class="note" x="537.5" y="128.0">ids to vectors +</text><text class="note" x="537.5" y="142.0">position</text></g><g class="part bit" id="p-att"><rect pathLength="1" x="679.7" y="68.0" width="145.6" height="44" rx="12"/><text class="label" x="752.5" y="95.0">Self-attention</text><text class="note" x="752.5" y="128.0">Q, K, V: who matters to</text><text class="note" x="752.5" y="142.0">whom</text></g><g class="part bit" id="p-mlp"><rect pathLength="1" x="688.1" y="248.0" width="128.8" height="44" rx="12"/><text class="label" x="752.5" y="275.0">Feed-forward</text><text class="note" x="752.5" y="308.0">transforms features</text></g><g class="part bit" id="p-head"><rect pathLength="1" x="477.3" y="248.0" width="120.4" height="44" rx="12"/><text class="label" x="537.5" y="275.0">Output head</text><text class="note" x="537.5" y="308.0">scores for every token</text></g><g class="part bit" id="p-pick"><rect pathLength="1" x="274.9" y="248.0" width="95.2" height="44" rx="12"/><text class="label" x="322.5" y="275.0">Decoding</text><text class="note" x="322.5" y="308.0">choose one token</text></g></svg><div class="hud" id="hud"></div><ol><li class="say" tabindex="0" data-show="p-prompt p-tok" data-hud=""><b>1</b><span data-text="The tokenizer cuts your prompt into tokens and turns each into a number."></span></li><li class="say" tabindex="0" data-show="p-tok p-emb" data-hud=""><b>2</b><span data-text="Each number becomes a vector, with its position added, so word order counts."></span></li><li class="say" tabindex="0" data-show="p-emb p-att" data-hud=""><b>3</b><span data-text="Self-attention lets every token look at the others and take what it needs from them."></span></li><li class="say" tabindex="0" data-show="p-att p-mlp" data-hud=""><b>4</b><span data-text="A feed-forward network then reshapes each token; this pair of layers repeats many times."></span></li><li class="say" tabindex="0" data-show="p-mlp p-head p-pick" data-hud=""><b>5</b><span data-text="The output head scores every possible next token, and decoding picks one."></span></li><li class="say" tabindex="0" data-show="p-pick p-tok" data-hud=""><b>6</b><span data-text="The new token is added to the text and the loop runs again, one token at a time."></span></li></ol><div class="bar"><span class="credit">A prompt becomes tokens, tokens become vectors, attention mixes them, and the model picks the next token, again and again.</span><button id="replay" type="button">Replay</button></div></main><script>var steps=[].slice.call(document.querySelectorAll('.say')),think=document.getElementById('think'),hud=document.getElementById('hud'),slow=!matchMedia('(prefers-reduced-motion: reduce)').matches,running=false;function wait(ms){return new Promise(function(r){setTimeout(r,slow?ms:0)})}function plain(t){var d=document.createElement('textarea');d.innerHTML=t;return d.value}function els(s){return (s.dataset.show||'').split(' ').filter(Boolean).map(function(id){return document.getElementById(id)}).filter(Boolean)}function links(){document.querySelectorAll('.link').forEach(function(l){var a=document.getElementById(l.dataset.a),b=document.getElementById(l.dataset.b);if(a&&b&&a.classList.contains('shown')&&b.classList.contains('shown'))l.classList.add('shown')})}function mark(s){document.querySelectorAll('.on').forEach(function(e){e.classList.remove('on')});hud.innerHTML='';if(!s)return;var es=els(s),ids=es.map(function(e){return e.id});es.forEach(function(e){e.classList.add('on')});document.querySelectorAll('.link').forEach(function(l){if(ids.indexOf(l.dataset.a)>=0&&ids.indexOf(l.dataset.b)>=0)l.classList.add('on')});hud.innerHTML=s.dataset.hud||''}async function type(el,text){text=plain(text);if(!slow){el.textContent=text;return}for(var i=1;i<=text.length;i+=2){el.textContent=text.slice(0,i+1);await wait(16)}}async function build(){if(running)return;running=true;document.body.classList.remove('done');document.querySelectorAll('.bit').forEach(function(e){e.classList.remove('shown')});steps.forEach(function(s){s.classList.remove('shown','now');s.querySelector('span').textContent=''});mark(null);var lines=JSON.parse(think.dataset.lines);for(var k=0;k<lines.length;k++){await type(think,lines[k]);await wait(450)}for(var i=0;i<steps.length;i++){var s=steps[i];s.classList.add('shown','now');var es=els(s);for(var j=0;j<es.length;j++){es[j].classList.add('shown');links();mark(s);await wait(240)}mark(s);await type(s.querySelector('span'),s.querySelector('span').dataset.text);await wait(800);s.classList.remove('now')}document.querySelectorAll('.bit').forEach(function(e){e.classList.add('shown')});mark(null);think.textContent=think.dataset.done;document.body.classList.add('done');running=false}steps.forEach(function(s){s.addEventListener('mouseenter',function(){if(!running)mark(s)});s.addEventListener('focus',function(){if(!running)mark(s)});s.addEventListener('mouseleave',function(){if(!running)mark(null)});s.addEventListener('blur',function(){if(!running)mark(null)})});document.getElementById('replay').addEventListener('click',build);build();</script></body></html>
