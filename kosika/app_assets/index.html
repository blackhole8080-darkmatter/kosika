<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosika Studio</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --rail: #efece5; --ink: #1d1b18; --soft: #6c675f; --faint: #9a958b; --line: #e3dfd6;
  --accent: #b4532a; --accent-soft: #f7e7dd; --ok: #2f7d4f; --ok-soft: #e2f1e7;
  --bad: #b3382c; --bad-soft: #f8e3e0; --warn: #8a6100; --warn-soft: #f8ecd0;
  --think: #5b4bb5; --think-soft: #ebe8fa; --mem: #1f6f8b; --mem-soft: #dff0f5;
  --code: #57534a; --code-soft: #eeebe4; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513; --panel: #1f1e1b; --rail: #1a1917; --ink: #eceae5; --soft: #a39f96; --faint: #76726a; --line: #33312c;
    --accent: #e08a5f; --accent-soft: #3a261c; --ok: #6fc191; --ok-soft: #1b3125;
    --bad: #ec8377; --bad-soft: #3b1f1c; --warn: #e2b54a; --warn-soft: #392e13;
    --think: #a99cf0; --think-soft: #29254a; --mem: #6cc3de; --mem-soft: #17313a;
    --code: #b9b4a8; --code-soft: #2a2824;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 system-ui, "Segoe UI", sans-serif; display: grid; grid-template-columns: 212px minmax(0, 1fr); }
aside.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 3px; height: 100vh; position: sticky; top: 0; align-self: start; }
.brand { font-weight: 700; font-size: 17px; padding: 2px 10px 14px; display: flex; align-items: center; gap: 9px; }
.brand .mark { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; }
.brand small { font-weight: 500; color: var(--soft); font-size: 17px; }
.nav { padding: 8px 10px; border-radius: 9px; cursor: pointer; color: var(--soft); font-weight: 500; display: flex; gap: 9px; align-items: center; transition: background .15s, color .15s; user-select: none; }
.nav:hover { background: var(--code-soft); color: var(--ink); } .nav.on { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rail .foot { margin-top: auto; padding: 10px; font-size: 12.5px; color: var(--soft); display: flex; flex-direction: column; gap: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; } .dot.off { background: var(--warn); }
main { padding: 22px 26px 60px; min-width: 0; }
h1 { font-size: 23px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 22px 0 9px; } p.lead { color: var(--soft); margin: 0 0 16px; max-width: 78ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 15px; cursor: pointer; transition: border-color .15s, transform .15s var(--ease); display: flex; flex-direction: column; gap: 9px; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card h3 { margin: 0; font-size: 16px; } .card .about { color: var(--soft); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.9em; }
.path { font: 11.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--code-soft); color: var(--code); white-space: nowrap; }
.chip.think { background: var(--think-soft); color: var(--think); } .chip.mem { background: var(--mem-soft); color: var(--mem); } .chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.accent { background: var(--accent-soft); color: var(--accent); }
.back { color: var(--soft); cursor: pointer; font-size: 13px; display: inline-block; margin-bottom: 8px; } .back:hover { color: var(--accent); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 16px 0; flex-wrap: wrap; }
.tab { padding: 7px 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--soft); font-weight: 500; transition: color .15s; } .tab:hover { color: var(--ink); } .tab.on { color: var(--ink); border-color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 15px; }
.split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 15px; align-items: start; } @media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 8px 15px; cursor: pointer; font-weight: 600; transition: transform .1s, opacity .15s; } button:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: default; } button.quiet { background: var(--code-soft); color: var(--ink); }
textarea, input[type=text] { width: 100%; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .15s; }
textarea:focus, input[type=text]:focus { border-color: var(--accent); } textarea { min-height: 110px; resize: vertical; font-family: var(--mono); font-size: 13px; }
pre { margin: 0; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
pre.source { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 13px; max-height: 70vh; overflow: auto; }
.kw { color: var(--accent); font-weight: 600; } .cm { color: var(--faint); font-style: italic; } .st { color: var(--ok); }
.row { display: flex; gap: 9px; align-items: center; } .row > input { flex: 1; }
.banner { padding: 9px 13px; border-radius: 10px; margin-bottom: 12px; font-size: 13.5px; } .banner.bad { background: var(--bad-soft); color: var(--bad); } .banner.warn { background: var(--warn-soft); color: var(--warn); } .banner.ok { background: var(--ok-soft); color: var(--ok); }
.empty { color: var(--faint); font-style: italic; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* chat */
.chatlog { min-height: 260px; max-height: 58vh; overflow: auto; margin-bottom: 11px; display: flex; flex-direction: column; gap: 9px; padding-right: 4px; }
.msg { display: flex; animation: rise .28s var(--ease); } .msg.you { justify-content: flex-end; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.bubble { max-width: 84%; padding: 9px 13px; border-radius: 15px; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); word-break: break-word; }
.msg.you .bubble { background: var(--accent-soft); border-color: transparent; }
.bubble .meta { display: block; font-size: 11.5px; color: var(--faint); margin-top: 4px; }
.typing span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); margin-right: 4px; animation: bob 1s infinite; } .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
.ask { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 13px; padding: 12px 14px; animation: rise .28s var(--ease); max-width: 92%; }
.ask b { color: var(--warn); } .ask pre { color: var(--ink); margin: 7px 0 10px; background: var(--panel); border-radius: 8px; padding: 8px 10px; max-height: 180px; overflow: auto; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 9px; } .quick span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--soft); cursor: pointer; transition: border-color .15s, color .15s; } .quick span:hover { border-color: var(--accent); color: var(--accent); }

/* the flow: still and live */
.wf + .wf { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
.wf-title { font: 600 13.5px var(--mono); margin: 0 0 3px; } .wf-sub { color: var(--soft); font-size: 12.5px; margin-bottom: 12px; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 11px; position: relative; padding-bottom: 12px; }
.step::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.step::after { content: ""; position: absolute; left: 14px; top: 30px; height: 0; width: 2px; background: var(--ok); transition: height .45s var(--ease); }
.step.done::after { height: calc(100% - 30px); }
.step:last-child::before, .step:last-child::after { display: none; }
.num { width: 30px; height: 30px; border-radius: 50%; background: var(--code-soft); color: var(--code); display: grid; place-items: center; font-weight: 600; font-size: 12px; z-index: 1; transition: background .3s, color .3s, transform .3s var(--ease); }
.num.think, .num.model { background: var(--think-soft); color: var(--think); } .num.memory { background: var(--mem-soft); color: var(--mem); }
.num.workflow, .num.agent, .num.board { background: var(--accent-soft); color: var(--accent); } .num.files, .num.tool, .num.web { background: var(--warn-soft); color: var(--warn); }
.step .body { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; transition: border-color .3s, background .3s; min-width: 0; }
.step .name { font: 600 13px var(--mono); } .step .does { color: var(--soft); font-size: 12.5px; margin-top: 1px; }
.step .branch { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; margin-top: 3px; transition: opacity .3s; } .step .branch .when { font: 11.5px var(--mono); color: var(--accent); min-width: 84px; }
.step .now { font-size: 12px; margin-top: 4px; color: var(--accent); } .step .now:empty { display: none; }
.live { max-height: 64vh; overflow: auto; padding: 6px 6px 0 2px; }
.live .step { opacity: .5; transition: opacity .35s; } .live .step.running, .live .step.done, .live .step.failed, .live .step.waiting { opacity: 1; }
.live .step.running > .num { background: var(--accent); color: #fff; transform: scale(1.12); animation: pulse 1.3s infinite; }
.live .step.running > .body { border-color: var(--accent); background: var(--accent-soft); }
.live .step.done > .num { background: var(--ok); color: #fff; } .live .step.done > .body { border-color: var(--ok); } .live .step.done .now { color: var(--soft); }
.live .step.failed > .num { background: var(--bad); color: #fff; } .live .step.failed > .body { border-color: var(--bad); }
.live .step.waiting > .num { background: var(--warn); color: #fff; animation: pulse 1.3s infinite; } .live .step.waiting > .body { border-color: var(--warn); background: var(--warn-soft); }
.live .branch.skipped { opacity: .32; } .live .branch.taken .when { font-weight: 700; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.sub { margin-top: 9px; padding: 9px 0 0 6px; border-top: 1px dashed var(--line); animation: unfold .4s var(--ease); }
@keyframes unfold { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.sub .wf-title { font-size: 12px; color: var(--soft); margin-bottom: 8px; }
.tally { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--soft); padding: 9px 2px 0; border-top: 1px solid var(--line); margin-top: 8px; } .tally b { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.bubble.draft { color: var(--soft); } .caret { display: inline-block; width: 7px; height: 1em; background: var(--accent); margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* swarm */
.stage { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 14px 6px 6px; }
.member { width: 132px; text-align: center; padding: 10px 6px; border-radius: 13px; border: 1px solid transparent; transition: border-color .3s, background .3s, transform .3s var(--ease); }
.member.active { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); }
.face { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; font-weight: 700; color: #fff; transition: box-shadow .3s; }
.member.active .face { animation: pulse 1.3s infinite; } .member.spoke .face { box-shadow: 0 0 0 5px var(--ok-soft); }
.c0 { --who: #b4532a; } .c1 { --who: #1f6f8b; } .c2 { --who: #5b4bb5; } .c3 { --who: #2f7d4f; } .c4 { --who: #8a6100; }
.face { background: var(--who, var(--accent)); } .who { font: 600 13px var(--mono); } .doing { font-size: 12px; color: var(--accent); min-height: 1.4em; }
.round { text-align: center; font-size: 12.5px; color: var(--soft); min-height: 1.5em; }
.feed { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow: auto; margin: 10px 0; }
.post { border-left: 3px solid var(--who, var(--accent)); background: var(--bg); border-radius: 0 10px 10px 0; padding: 7px 11px; animation: rise .3s var(--ease); white-space: pre-wrap; word-break: break-word; }
.post b { display: block; font: 600 12px var(--mono); color: var(--who, var(--accent)); } .post small { color: var(--faint); }

/* editor */
.map { display: grid; gap: 14px; } .map h4 { margin: 0 0 7px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); }
.map .purpose { font-size: 16px; line-height: 1.45; } .map .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px; }
.map .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.map .item { padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; } .map .item:first-of-type { border-top: 0; }
.map .item .from { float: right; font-size: 11px; color: var(--faint); margin-left: 8px; } .map .item .small { display: block; color: var(--soft); font-size: 12px; }
.map .unseen { border-style: dashed; } .map .step { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.map .step:first-of-type { border-top: 0; } .map .step .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.map details, .map .choice { font-size: 12.5px; color: var(--soft); margin-top: 4px; } .map summary { cursor: pointer; } .map .choice { padding-left: 14px; }
.map .in { margin: 4px 0 4px 16px; padding-left: 10px; border-left: 2px solid var(--line); color: var(--ink); } .map .in .small { display: block; color: var(--soft); }
.map details.item { color: var(--ink); font-size: 13.5px; margin: 0; } .difflines { font: 12px/1.5 var(--mono); margin: 8px 0 4px; padding: 8px 10px; background: var(--bg); border-radius: 8px; overflow-x: auto; white-space: pre; }
.difflines .add { color: var(--ok); } .difflines .cut { color: var(--bad); } .difflines .at { color: var(--faint); }
.map .empty { color: var(--faint); font-size: 13px; } .map .foot { color: var(--faint); font-size: 12px; }
.stage { background: var(--bg); border-radius: 10px; overflow: hidden; display: grid; place-items: center; min-height: 120px; } .stage svg { width: 100%; height: auto; max-height: 62vh; display: block; }
.offers { min-height: 30px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; } .hint { color: var(--faint); font-size: 12px; }
.offer { font: 12.5px var(--mono); padding: 3px 9px; border-radius: 7px; background: var(--code-soft); color: var(--ink); cursor: pointer; } .offer.first { background: var(--accent-soft); color: var(--accent); }
.offer i { font: 11px system-ui, sans-serif; color: var(--faint); font-style: normal; }
textarea.editor { min-height: 62vh; font: 12.5px/1.55 var(--mono); tab-size: 2; white-space: pre; overflow: auto; }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; } .bar .say { font-size: 13px; color: var(--soft); }
select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.card.new { cursor: default; border-style: dashed; } .card.new:hover { transform: none; }

/* story, requests, data, memory */
.story .s { padding: 9px 0; border-bottom: 1px solid var(--line); } .story .s:last-child { border: 0; }
.head { font-weight: 600; font-size: 13.5px; } .head .t { color: var(--faint); font-weight: 400; font-size: 12px; margin-left: 6px; }
.story .inside { margin: 5px 0 5px 4px; padding-left: 12px; border-left: 2px solid var(--line); }
.story .ans { margin-top: 3px; font: 12.5px var(--mono); word-break: break-word; } .note { font-size: 12.5px; margin-top: 3px; } .note.bad { color: var(--bad); } .note.q { color: var(--ok); } .note.v { color: var(--think); }
.req { border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; margin-bottom: 10px; background: var(--bg); } .req .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin: 8px 0 3px; font-weight: 600; }
.rec { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; transition: border-color .25s, box-shadow .25s; } .rec.hit { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rec h4 { margin: 0 0 6px; font: 600 13.5px var(--mono); } .rec .f { display: flex; justify-content: space-between; gap: 10px; font: 12.5px var(--mono); padding: 2px 0; } .rec .f .ty { color: var(--think); } .rec .f .ty.link { cursor: pointer; text-decoration: underline dotted; }
.memgraph { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 0 18px; align-items: start; margin-bottom: 20px; }
.memroot { background: var(--mem-soft); color: var(--mem); border-radius: 11px; padding: 10px 12px; font-weight: 600; } .memroot small { display: block; font-weight: 400; opacity: .85; }
.ment { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; margin-bottom: 8px; animation: rise .3s var(--ease); }
.ment::before { content: ""; position: absolute; left: -18px; top: 18px; width: 18px; height: 2px; background: var(--mem); opacity: .5; } .ment .k { font: 600 12.5px var(--mono); color: var(--mem); }
.runs { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 15px; } @media (max-width: 820px) { .runs { grid-template-columns: 1fr; } }
.runlist { max-height: 70vh; overflow: auto; } .runlist div { padding: 7px 10px; border-radius: 8px; cursor: pointer; font: 12px var(--mono); transition: background .15s; } .runlist div:hover, .runlist div.on { background: var(--code-soft); } .runlist small { color: var(--faint); display: block; }
.test { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; } .test:last-child { border: 0; } .test .why { color: var(--bad); font: 12.5px var(--mono); margin-top: 2px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; margin-top: 12px; } .fact { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; }
.fact b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin-bottom: 5px; font-weight: 600; } .fact .line { font-size: 13px; word-break: break-word; }
</style>
</head>
<body>
<aside class="rail">
  <div class="brand"><span class="mark">K</span><span>Kosika <small>Studio</small></span></div>
  <div id="nav"></div>
  <div class="foot" id="foot"></div>
</aside>
<main id="main"></main>

<template id="icon-tools"><svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.300 5.300L3 18l3 3 6.200-6.200a4 4 0 0 0 5.300-5.300l-2.500 2.500-2.500-2.500 2.500-2.500z"/></svg></template>
<template id="icon-permissions"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.800-1-8-4.500-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg></template>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const main = document.getElementById("main");
let overview = null;

// Every piece of text reaches the page through textContent, never as markup.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === false || value == null) continue;
    if (key === "class") el.className = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value);
  }
  for (const kid of kids.flat(3)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const chip = (text, kind) => h("span", {class: "chip " + (kind || "")}, text);
const sleep = ms => new Promise(done => setTimeout(done, ms));
// replaceChildren and append would print a missing piece as the word "null".
const fill = (el, ...kids) => { el.replaceChildren(...kids.flat().filter(kid => kid != null && kid !== false)); return el; };
const icon = name => document.getElementById("icon-" + name).content.cloneNode(true);

// The readable part of an answer that is still being written. A model step
// answers with one JSON object; this pulls out its first piece of text.
function partial(raw) {
  const open = raw.match(/^\s*\{\s*"[^"]*"\s*:\s*"/);
  if (!open) return "";
  const body = raw.slice(open[0].length);
  let out = "";
  for (let i = 0; i < body.length; i++) {
    const c = body[i];
    if (c === '"') break;
    if (c !== "\\") { out += c; continue; }
    if (i + 1 >= body.length) break;
    const next = body[++i];
    if (next === "u") { if (i + 4 >= body.length) break; out += String.fromCharCode(parseInt(body.slice(i + 1, i + 5), 16)); i += 4; }
    else out += next === "n" ? "\n" : next === "t" ? "\t" : next === "r" ? "" : next;
  }
  return out;
}

// What an agent is asking to be allowed to do, in words.
const isProgram = request => request.kind === "system:shell";
const askTitle = request => isProgram(request) ? "Wants to start this program, and nothing else:" : "Wants to do this, and nothing else: " + (request.tool || "an action");
function askLines(request) {
  const given = request.arguments || {};
  if (isProgram(request)) {
    const words = (given.args || []).map(word => /[\s"]/.test(word) || word === "" ? JSON.stringify(word) : word);
    return [request.operation, ...words].join(" ") + "\n\nIt runs inside the granted folder and is stopped after 60 seconds.";
  }
  const lines = Object.entries(given).filter(([key, value]) => value != null).map(([key, value]) => key + ": " + (typeof value === "string" ? value : JSON.stringify(value)));
  if (request.kind && !request.kind.includes(":")) lines.push("", "This goes to the MCP server " + request.kind + ".");
  return lines.join("\n");
}

async function api(path, options) {
  const response = await fetch(path, {...(options || {}), headers: {"X-Kosika-Token": token, "Content-Type": "application/json"}});
  const data = await response.json().catch(() => ({error: "The app gave an unreadable answer."}));
  if (!response.ok) throw new Error(data.error || "Request failed");
  return data;
}

function go(view, id) { location.hash = "#" + view + (id ? "/" + encodeURIComponent(id) : ""); }
window.addEventListener("hashchange", route);

function drawRail(active) {
  const items = [["assistant", "Assistant"], ["project", "Project"], ["agents", "Agents"], ["runs", "Runs"], ["tools", "Tools"], ["permissions", "Permissions"]];
  document.getElementById("nav").replaceChildren(...items.map(([key, label]) =>
    h("div", {class: "nav" + (key === active ? " on" : ""), onclick: () => go(key)}, icon(key), label)));
  document.getElementById("foot").replaceChildren(
    h("div", null, h("span", {class: "dot" + (overview.can_run ? "" : " off")}), overview.can_run ? overview.model : "no model: view and test only"),
    h("div", {class: "path", title: overview.root}, overview.root.split(/[\\/]/).slice(-2).join("/")));
}

let routing = 0;
async function route() {
  const mine = ++routing;
  const [view, rawId] = location.hash.slice(1).split("/");
  const id = rawId ? decodeURIComponent(rawId) : "";
  try {
    overview = await api("/api/agents");
    if (mine !== routing) return;
    const active = view || "assistant";
    drawRail(active === "agent" ? "agents" : active);
    if (active === "agents") showAgents();
    else if (active === "agent") await showAgent(id, false);
    else if (active === "project") await showProject();
    else if (active === "runs") await showRuns();
    else if (active === "tools") await showTools();
    else if (active === "permissions") showPermissions();
    else if (overview.assistant) await showAgent(overview.assistant, true);
    else showAgents();
  } catch (error) {
    main.replaceChildren(h("div", {class: "banner bad"}, String(error.message || error)));
  }
}

function badges(agent) {
  if (agent.error) return [chip("does not check", "bad")];
  const out = [];
  for (const model of agent.models) out.push(chip("model " + model, "think"));
  for (const memory of agent.memories) out.push(chip("remembers " + memory.name, "mem"));
  for (const board of agent.boards || []) out.push(chip("board " + board.name, "accent"));
  if (agent.tools.length) out.push(chip(agent.tools.length + " tool" + (agent.tools.length > 1 ? "s" : ""), agent.changes_world ? "warn" : ""));
  if (agent.changes_world) out.push(chip("asks before changing things", "warn"));
  if (agent.swarms.length) out.push(chip("swarm", "accent"));
  if (agent.tests) out.push(chip(agent.tests + " test" + (agent.tests > 1 ? "s" : ""), "ok"));
  if (agent.chat) out.push(chip("chat", "accent"));
  return out;
}

// The Project page: everything in the folder in one list, searchable, and
// suggestions that come from rules applied to the checked programs.
const KIND_ORDER = ["agent", "workflow", "model", "tool", "memory", "board", "swarm", "record"];
const KIND_LABEL = {agent: "Agents", workflow: "Workflows", model: "Models", tool: "Tools", memory: "Memories", board: "Boards", swarm: "Swarms", record: "Data records"};
const KIND_CHIP = {agent: "accent", workflow: "", model: "think", tool: "warn", memory: "mem", board: "accent", swarm: "accent", record: "ok"};
async function showProject() {
  main.replaceChildren(h("p", {class: "lead"}, h("span", {class: "spin"}), "Reading every program"));
  const project = await api("/api/project");
  const search = h("input", {type: "text", placeholder: "Search every agent, workflow, model, tool, memory and record"});
  const list = h("div"), tally = h("div", {class: "chips", style: "margin:12px 0"});
  let only = "";
  function draw() {
    const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = item => (!only || item.kind === only) && words.every(word => (item.name + " " + item.detail + " " + item.title + " " + item.kind).toLowerCase().includes(word));
    const found = project.items.filter(hit);
    fill(tally, h("span", {class: "chip" + (only ? "" : " accent"), style: "cursor:pointer", onclick: () => { only = ""; draw(); }}, "Everything " + project.items.length),
      KIND_ORDER.filter(kind => project.counts[kind]).map(kind => h("span", {class: "chip " + (only === kind ? "accent" : ""), style: "cursor:pointer", onclick: () => { only = only === kind ? "" : kind; draw(); }}, KIND_LABEL[kind] + " " + project.counts[kind])));
    fill(list, found.length ? KIND_ORDER.filter(kind => found.some(item => item.kind === kind)).map(kind => h("div", {class: "panel", style: "margin-bottom:12px"}, h("h4", null, KIND_LABEL[kind]),
      found.filter(item => item.kind === kind).slice(0, 200).map(item => h("div", {class: "item", style: "cursor:pointer", onclick: () => go("agent", item.agent)},
        h("span", {class: "from"}, item.title + (item.line ? ", line " + item.line : "")), h("b", null, item.name), " ", h("span", {class: "small", style: "display:inline"}, item.detail))))) : h("div", {class: "empty"}, "Nothing matches."));
  }
  search.addEventListener("input", draw);
  const must = project.suggestions.filter(s => s.must), could = project.suggestions.filter(s => !s.must);
  const advice = s => h("div", {class: "item", style: "cursor:pointer", onclick: () => go("agent", s.agent)}, h("span", {class: "from"}, "rule: " + s.rule + (s.line ? ", line " + s.line : "")), h("b", null, s.title), " ", s.text);
  fill(main, h("h1", null, "Project"),
    h("p", {class: "lead"}, "Everything in this folder, in one place. Click anything to open the agent it belongs to."),
    h("div", {class: "map"},
      must.length ? h("div", {class: "panel"}, h("h4", null, "To fix"), must.map(advice)) : null,
      h("div", {class: "panel"}, h("h4", null, "Suggestions"), could.length ? could.map(advice) : h("div", {class: "empty"}, "None. Every rule is satisfied."),
        h("div", {class: "foot", style: "margin-top:8px"}, "Each suggestion comes from a rule applied to the checked program, never from a model. Ignore any that does not fit.")),
      h("div", null, search, tally, list)));
  draw();
}

function showAgents() {
  const agents = overview.agents;
  main.replaceChildren(
    h("h1", null, "Agents"),
    h("p", {class: "lead"}, agents.length ? agents.length + " programs in this folder. Open one to watch it work, test it, and see what it is made of." : "No Kosika programs with a main workflow were found in this folder."),
    h("div", {class: "grid"}, agents.map(agent => h("div", {class: "card", onclick: () => go("agent", agent.id)},
      h("h3", null, agent.title),
      h("div", {class: "about"}, agent.error ? agent.error : (agent.about || "No description. Add a // comment at the top of the file.")),
      h("div", {class: "chips"}, badges(agent)), h("div", {class: "path"}, agent.path))), newAgentCard()));
}

function newAgentCard() {
  const words = {support: "Support desk: sorts a message and drafts a reply", expense: "Expense checker: reads a receipt, code applies the rules", notes: "Meeting notes: summary, decisions and actions"};
  const name = h("input", {type: "text", placeholder: "name, for example my_helper"});
  const kind = h("select", null, (overview.starters || []).map(item => h("option", {value: item}, words[item] || item)));
  const out = h("div");
  const make = async () => {
    try { const made = await api("/api/new", {method: "POST", body: JSON.stringify({name: name.value.trim(), kind: kind.value})}); go("agent", made.id); }
    catch (error) { fill(out, h("div", {class: "banner bad", style: "margin:0"}, error.message)); }
  };
  name.addEventListener("keydown", event => { if (event.key === "Enter") make(); });
  return h("div", {class: "card new"}, h("h3", null, "New agent"),
    h("div", {class: "about", style: "min-height:0"}, "Start from a working example with its tests, then change it in the Code tab."),
    name, kind, h("div", null, h("button", {onclick: make}, "Create")), out);
}

const fact = (title, lines, empty) => h("div", {class: "fact"}, h("b", null, title), lines.length ? lines.map(line => h("div", {class: "line"}, line)) : h("div", {class: "line empty"}, empty));

// The MCP servers this Studio was started with, and what each offers.
async function showTools() {
  main.replaceChildren(h("h1", null, "Tools"), h("p", {class: "lead"}, h("span", {class: "spin"}), "Asking the servers what they offer"));
  const head = [h("h1", null, "Tools"),
    h("p", {class: "lead"}, "MCP servers are programs that offer tools: search, files, calendars, databases and many more. An agent may use a server's tool only when you named that server when starting Studio. Copy a tool's text into an agent's Code tab, then add the tool to an agent's can list.")];
  if (!overview.mcp.length) {
    fill(main, head, h("div", {class: "banner warn"}, "No MCP server was granted. Start Studio with --mcp NAME=COMMAND, for example: --mcp notes=\"python notes_server.py\""));
    return;
  }
  const data = await api("/api/mcp");
  fill(main, head, data.servers.map(server => h("div", {class: "panel", style: "margin-bottom:14px"},
    h("div", {class: "wf-title"}, "server " + server.name), h("div", {class: "wf-sub"}, "started with: " + server.command),
    server.error ? h("div", {class: "banner bad", style: "margin:0"}, server.error)
      : h("div", {class: "grid", style: "grid-template-columns:repeat(auto-fill,minmax(330px,1fr))"}, server.tools.map(tool => {
        const text = h("pre", {class: "source", style: "max-height:230px;display:none"}, tool.declaration);
        const copy = h("button", {class: "quiet", onclick: async () => {
          try { await navigator.clipboard.writeText(tool.declaration); copy.textContent = "Copied"; }
          catch (error) { text.style.display = "block"; copy.textContent = "Select and copy below"; }
        }}, "Copy Kosika text");
        return h("div", {class: "rec"}, h("h4", null, tool.name),
          h("div", {class: "chips", style: "margin-bottom:6px"}, tool.read_only ? chip("only reads", "ok") : chip("asks you before each use", "warn")),
          h("div", {class: "about", style: "color:var(--soft);font-size:13px;margin-bottom:8px"}, tool.description || "The server gives no description."),
          h("div", {class: "row"}, copy, h("button", {class: "quiet", onclick: () => { text.style.display = text.style.display === "none" ? "block" : "none"; }}, "Show")), text);
      })))));
}

function showPermissions() {
  main.replaceChildren(
    h("h1", null, "Permissions"),
    h("p", {class: "lead"}, "What this Studio was allowed to do when it was started. Agents cannot give themselves more: a program only names what it wants, and these are the grants."),
    h("div", {class: "facts"},
      fact("Model", [overview.can_run ? overview.model + " answers for every agent" : "None. Agents can be viewed and tested, not run."]),
      fact("Folder agents may look in", [overview.allow_folder || "None. File tools find nothing."]),
      fact("Websites agents may read", overview.sites, "None. The web cannot be reached."),
      fact("Changing things", ["Only after you press Allow once, for that one action.", "The card shows exactly what will be done before you answer.", "No answer in ten minutes counts as a refusal."]),
      fact("MCP servers", overview.mcp, "None. Start Studio with --mcp NAME=COMMAND to grant one."),
      fact("Sessions", overview.sessions ? ["On. Each agent works in its own copy of the granted folder.", "Its programs run behind a wall: no network, no other files, a read-only system.", "Its steps there do not ask you one by one. Nothing reaches the real folder until you bring the changes back."] : ["Off. Agents work in the granted folder itself, and each change asks you first.", "Start Studio with --in-session to turn them on."]),
      fact("Search by meaning", overview.embed ? ["Allowed, with the embedding model " + overview.embed + ".", "It only reads, inside the granted folder.", "What it learns about each line is kept on this computer, outside that folder."] : ["Not allowed. Start Studio with --embed-model to permit it."]),
      fact("Starting programs", overview.shell ? ["Allowed, only the programs an agent's tools name.", "Each start waits for your Allow once and shows the exact command.", "Runs inside the granted folder, stopped after 60 seconds."] : ["Not allowed. Start Studio with --allow-shell to permit it."]),
      fact("Never allowed here", ["Files outside the granted folder", "Websites that are not on the list", "Anything at all without the grants above"]),
      fact("Where programs come from", [overview.root])),
    h("h2", null, "How to change these"),
    h("p", {class: "lead"}, "Stop Studio and start it again with different options: --model NAME, --allow-folder FOLDER, --allow-site SITE, --allow-shell, --mcp NAME=COMMAND."));
}

// ---------------------------------------------------------------- the flow
const KIND_WORDS = {board: "agents talking", code: "plain code", think: "asks a model", model: "asks a model", memory: "memory", workflow: "runs a workflow", agent: "asks an agent", files: "looks at files", web: "reads the web", tool: "uses a tool"};
function callText(call) {
  if (call.kind === "think") return call.text + " with model " + call.model + (call.evidence ? ", must quote its evidence" : "");
  if (call.kind === "model") return "ask model " + call.text;
  if (call.kind === "memory") return call.text.replace(/^recall /, "look up in memory ").replace(/^remember /, "save to memory ");
  if (call.kind === "board") return call.text.replace(/^read /, "read board ");
  if (call.kind === "workflow") return "run workflow " + call.text;
  if (call.kind === "agent") return "ask agent " + call.text;
  if (call.kind === "web") return "read a web page (allowed sites only)";
  if (call.kind === "files" || call.kind === "tool") return "tool " + call.text + (call.changes ? " (asks you first)" : " (read-only)");
  if (call.text === "the clock") return "look at the clock";
  if (call.text === "a random number") return "draw a random number";
  if (/\$(otherwise|case\d+)$/.test(call.text)) return "use the value written in the program";
  return "compute " + call.text + " in code";
}

// Draws one workflow. Gives back its element and a map from step name to node.
function drawWorkflow(workflow) {
  const nodes = {};
  const flow = h("div", {class: "flow"}, workflow.steps.map((step, index) => {
    const first = step.options[0];
    const kind = step.single ? first.kind : "workflow";
    const now = h("div", {class: "now"});
    const body = h("div", {class: "body"}, h("div", {class: "name"}, step.name));
    const branches = [];
    if (step.single) body.append(h("div", {class: "does"}, callText(first)));
    else {
      body.append(h("div", {class: "does"}, "chooses one:"));
      for (const option of step.options) {
        const row = h("div", {class: "branch"}, h("span", {class: "when"}, option.when === null ? "otherwise" : "when " + JSON.stringify(option.when)), h("span", null, callText(option)));
        branches.push({option, row}); body.append(row);
      }
    }
    const extras = [];
    if (step.votes) extras.push(chip("vote " + step.votes + (step.voters && step.voters.length ? " across " + step.voters.join(", ") : ""), "think"));
    if (step.retries) extras.push(chip("retry " + step.retries, "think"));
    if (step.fallback) extras.push(chip("if it fails: " + callText(step.fallback), "warn"));
    if (extras.length) body.append(h("div", {class: "chips", style: "margin-top:6px"}, extras));
    body.append(now);
    const el = h("div", {class: "step"}, h("div", {class: "num " + kind, title: KIND_WORDS[kind] || ""}, index + 1), body);
    nodes[step.name] = {el, body, now, branches, started: 0};
    return el;
  }));
  return {flow, nodes};
}

function workflowTab(agent) {
  return h("div", {class: "panel"}, agent.workflows.map(workflow => {
    const budget = workflow.budget.map(([kind, amount]) => amount + " " + kind.replace("_", " ")).join(", ");
    return h("div", {class: "wf"}, h("div", {class: "wf-title"}, "workflow " + workflow.name),
      h("div", {class: "wf-sub"}, "takes " + (workflow.parameters.map(p => p.name + ": " + p.type).join(", ") || "nothing") + ", gives " + workflow.output + (budget ? " · budget " + budget : "") + (workflow.approval ? " · may ask for approval" : "")),
      drawWorkflow(workflow).flow);
  }));
}

// The live view: the same flow, driven by the events of a run as they arrive.
function liveView(agent, entry) {
  const byName = Object.fromEntries(agent.workflows.map(w => [w.name, w]));
  let writing = "", picked = [];
  const root = h("div", {class: "live"});
  const tally = h("div", {class: "tally"});
  const box = h("div", null, root, tally);
  let frames = [], counts = null, began = 0;
  function showTally(finished) {
    const seconds = Math.round((performance.now() - began) / 100) / 10;
    fill(tally, h("span", null, h("b", null, counts.steps), " steps"), h("span", null, h("b", null, counts.models), " model calls"),
      h("span", null, h("b", null, counts.tools), " tool or memory calls"), counts.tokens ? h("span", null, h("b", null, counts.tokens), " tokens") : null,
      began ? h("span", null, h("b", null, seconds), " s" + (finished ? "" : " so far")) : null);
  }
  function redraw() {
    const top = drawWorkflow(byName[entry || "main"] || agent.workflows[0]);
    root.replaceChildren(top.flow);
    frames = [{nodes: top.nodes, current: null}];
  }
  function reset(starting) {
    redraw();
    counts = {models: 0, tools: 0, steps: 0, tokens: 0}; began = starting ? performance.now() : 0; showTally(false);
  }
  function say(depth, text) { const frame = frames[depth]; if (frame && frame.current) frame.current.now.textContent = text; }
  function apply(event) {
    if (event.event === "model_text") {
      // The words arrive as the model writes them; show the latest under
      // the step that asked.
      writing += event.text;
      const asking = [...frames].reverse().find(item => item.current);
      const words = (partial(writing) || writing).replace(/\s+/g, " ");
      if (asking) asking.current.now.textContent = "writing: " + (words.length > 90 ? "…" + words.slice(-90) : words);
      return;
    }
    const depth = event.depth || 0, frame = frames[depth];
    if (!frame) return;
    if (event.event === "model_call") writing = "";
    if (event.event === "step_start") {
      const node = frame.nodes[event.step]; if (!node) return;
      // A run that carried on after an approval does not repeat the steps it
      // had already finished, so everything before this step is done.
      for (const earlier of Object.values(frame.nodes)) { if (earlier === node) break; if (!earlier.el.classList.contains("failed")) earlier.el.classList.add("done"); }
      frame.current = node; node.started = performance.now();
      node.el.classList.remove("done", "failed", "waiting"); node.el.classList.add("running");
      node.now.textContent = event.recovered ? "the first attempt failed, running the fallback" : "";
      // Follow the running step inside the flow's own box; the page stays put.
      const at = node.el.getBoundingClientRect(), view = root.getBoundingClientRect();
      if (at.top < view.top || at.top + 90 > view.bottom) root.scrollTo({top: root.scrollTop + at.top - view.top - 50, behavior: "smooth"});
      counts.steps += 1;
    } else if (event.event === "model_call") { counts.models += 1; say(depth, "asking the model…"); }
    else if (event.event === "agent_call") { counts.models += 1; picked = []; say(depth, "agent " + event.agent + " is thinking…"); }
    else if (event.event === "agent_tool") {
      // The agent chose this tool itself; show the chain of its choices.
      counts.tools += 1; picked.push(event.tool);
      say(depth, "agent " + event.agent + " chose: " + picked.join(" → ") + (event.access === "execute" ? " (asks you first)" : ""));
    }
    else if (event.event === "agent_return") { if (event.tokens) counts.tokens += event.tokens; say(depth, "agent " + (event.agent || "") + " answered" + (picked.length ? " after choosing " + picked.join(" → ") : "")); }
    else if (event.event === "model_return") {
      if (event.tokens) counts.tokens += event.tokens;
      const bits = [event.escalated ? "model " + event.escalated + " answered, after the first model's answer was refused" : "the model answered"]; if (event.rejected) bits.push(event.rejected + " answer(s) rejected first");
      if (event.votes && event.votes.asked) bits.push(event.votes.agreed + " of " + event.votes.asked + " agreed"); say(depth, bits.join(", "));
    } else if (event.event === "tool_call") {
      counts.tools += 1; const source = String(event.source || "");
      say(depth, source === "world:clock" ? "looking at the clock" : source === "world:random" ? "drawing a random number" : source.startsWith("memory:") ? (event.operation === "recall" ? "looking in memory " : "saving to memory ") + source.slice(7)
        : source.startsWith("board:") ? (event.operation === "post" ? "posting to board " : "reading board ") + source.slice(6)
        : source === "system:web" ? "reading a web page…" : "using " + (event.tool || "a tool") + "…");

// ------------------------------------------------- running, with the live view
async function follow(agent, body, live, onAsk, onWrite, path) {
  const started = await api((path || "/api/start") + "?id=" + encodeURIComponent(agent.id), {method: "POST", body: JSON.stringify(body)});
  const run = encodeURIComponent(started.run);
  live.reset(true); let since = 0, asked = false, raw = "";
  for (;;) {
    const view = await api("/api/poll?run=" + run + "&since=" + since);
    since = view.next;
    const steps = view.events.filter(event => event.event !== "model_text").length;
    for (const event of view.events) {
      live.apply(event);
      if (event.event === "model_call") raw = "";
      // Words are shown the moment they arrive; steps a beat apart, so
      // quick ones can still be seen.
      if (event.event === "model_text") { raw += event.text; if (onWrite) onWrite(partial(raw)); continue; }
      await sleep(steps > 12 ? 45 : 110);
    }
    if (view.state === "waiting" && !asked) {
      asked = true;
      onAsk(view.request || {}, async allow => { await api("/api/decide?run=" + run, {method: "POST", body: JSON.stringify({allow})}); await sleep(400); asked = false; });
    }
    if (view.state === "done" || view.state === "failed" || view.state === "refused") { live.finish(); return view; }
    await sleep(view.events.length ? 60 : 250);
  }
}

function highlight(source) {

  const words = /^(record|fn|workflow|model|default|memory|board|tool|agent|swarm|test|let|var|return|if|else|for|in|while|repeat|times|match|case|classify|extract|summarize|decide|recall|remember|post|read|under|into|from|given|using|with|evidence|vote|retry|otherwise|budget|expect|answers|call|execute|ask|use_model|require|approval|import|export|and|or|not|true|false|null|until|to|as|where)$/;
  for (const line of source.split("\n")) {
    const cut = line.indexOf("//"); const code = cut >= 0 ? line.slice(0, cut) : line;
    for (const part of code.split(/("(?:\\.|[^"\\])*")/)) {

}

  const bar = h("div", {class: "bar"});
  const reading = () => { fill(bar, h("button", {class: "quiet", onclick: editing}, "Edit"), h("span", {class: "say"}, agent.path)); fill(holder, highlight(agent.source || "")); fill(result); };
  const editing = () => { fill(bar, save, check, undo, h("button", {class: "quiet", onclick: reading}, "Done"), say); fill(holder, offers, area, trouble); area.focus(); offer(); assist(); };
  reading();
  return h("div", null, bar, result, holder);
}

// ------------------------------------------------------ one agent, live
function liveTab(agent, isAssistant) {
  const live = liveView(agent);
  const side = h("div");
  const sideTabs = h("div", {class: "tabs", style: "margin:0 0 12px"});
  const panes = {"Live": live.el, "What it did": h("p", {class: "empty"}, "Nothing has run yet."), "Requests": h("p", {class: "empty"}, "Nothing has run yet."), "Memory": h("div")};
  function pick(name) {
    for (const tab of sideTabs.children) tab.className = "tab" + (tab.textContent === name ? " on" : "");
    side.replaceChildren(panes[name]);
    if (name === "Memory") memoryView(agent, panes.Memory);
  }
  for (const name of Object.keys(panes)) sideTabs.append(h("div", {class: "tab", onclick: () => pick(name)}, name));
  const right = h("div", {class: "panel"}, sideTabs, side);
  const left = h("div", {class: "panel"});
  let busy = false;
  const after = view => { if (view.story) { panes["What it did"] = storyView(view.story); panes.Requests = requestsView(view.story); } };

  if (!overview.can_run) left.append(h("div", {class: "banner warn"}, "Studio was started without a model, so agents can be viewed and tested but not run. Start it with: kosika studio FOLDER --model NAME"));
  else if (agent.chat) {
    const log = h("div", {class: "chatlog"}, h("p", {class: "empty"}, "Say something to " + (isAssistant ? "your assistant" : agent.title) + ". Watch the flow on the right as it works."));
    const input = h("input", {type: "text", placeholder: "Ask anything"});
    const send = async given => {
      const text = (typeof given === "string" ? given : input.value).trim();
      if (!text || busy) return;
      busy = true;
      if (log.querySelector(".empty")) log.replaceChildren();
      input.value = ""; input.disabled = true; pick("Live");
      log.append(h("div", {class: "msg you"}, h("div", {class: "bubble"}, text)));
      const waiting = h("div", {class: "msg"}, h("div", {class: "bubble typing"}, h("span"), h("span"), h("span")));
      log.append(waiting); log.scrollTop = log.scrollHeight;
      const answer = (text, meta, bad) => waiting.replaceChildren(h("div", {class: "bubble"}, bad ? h("span", {style: "color:var(--bad)"}, text) : text, meta ? h("span", {class: "meta"}, meta) : null));
      try {
        const view = await follow(agent, {text}, live, (request, decide) => {
          const card = h("div", {class: "ask"});
          const press = allow => async () => { card.replaceChildren(h("b", null, allow ? "Allowed once." : "Refused.")); await decide(allow); };
          card.append(h("b", null, askTitle(request)), h("pre", null, askLines(request)),
            h("div", {class: "row"}, h("button", {onclick: press(true)}, "Allow once"), h("button", {class: "quiet", onclick: press(false)}, "Refuse")));
          log.insertBefore(card, waiting); log.scrollTop = log.scrollHeight;
        }, words => {
          if (!words) return;
          waiting.replaceChildren(h("div", {class: "bubble draft"}, words, h("span", {class: "caret"})));
          log.scrollTop = log.scrollHeight;
        });
        after(view);
        if (view.state === "done") answer(view.text, view.seconds + " s");
        else answer(view.error || "The run did not finish.", "", true);
      } catch (error) { answer(error.message, "", true); }
      busy = false; input.disabled = false; input.focus(); log.scrollTop = log.scrollHeight;
    };
    input.addEventListener("keydown", event => { if (event.key === "Enter") send(); });
    const quick = isAssistant ? h("div", {class: "quick"}, ["help", "play", "notes", "list", "any news today?"].map(text => h("span", {onclick: () => send(text)}, text))) : null;
    fill(left, log, quick, h("div", {class: "row"}, input, h("button", {onclick: () => send()}, "Send")));
  } else {
    const input = h("textarea", null); input.value = agent.example_input || "{}";
    const out = h("div", {style: "margin-top:12px"});
    const button = h("button", {onclick: async () => {
      let inputs;
      try { inputs = JSON.parse(input.value); } catch (error) { out.replaceChildren(h("div", {class: "banner bad"}, "The input is not valid JSON.")); return; }
      button.disabled = true; pick("Live"); out.replaceChildren(h("p", {class: "lead"}, h("span", {class: "spin"}), "Running. Watch the flow on the right."));
      try {
        const view = await follow(agent, {inputs}, live, (request, decide) => {
          const press = allow => async () => { out.replaceChildren(h("p", {class: "lead"}, h("span", {class: "spin"}), allow ? "Allowed once. Carrying on." : "Refused.")); await decide(allow); };
          out.replaceChildren(h("div", {class: "ask"}, h("b", null, askTitle(request)), h("pre", null, askLines(request)),
            h("div", {class: "row"}, h("button", {onclick: press(true)}, "Allow once"), h("button", {class: "quiet", onclick: press(false)}, "Refuse"))));
        });
        after(view);
        out.replaceChildren(view.state === "done" ? h("div", null, h("h2", null, "Result"), h("pre", {class: "source"}, JSON.stringify(view.result, null, 2))) : h("div", {class: "banner bad"}, view.error || "The run did not finish."));
      } catch (error) { out.replaceChildren(h("div", {class: "banner bad"}, error.message)); }
      button.disabled = false;
    }}, "Run");
    left.append(h("p", {class: "lead"}, "The input for main, as JSON." + (agent.example_input ? " Filled in from input.json." : "")), input, h("div", {style: "margin-top:9px"}, button), out);
  }
  pick("Live");
  return h("div", {class: "split"}, left, right);
}

// The Scene tab: play the animation a program describes. The picture is
// made by the app from the checked description; it holds no script.
function sceneTab(agent) {
  const given = h("textarea", {spellcheck: "false", style: "min-height:64px"}); given.value = agent.example_input || "{}";
  const stage = h("div", {class: "stage"}), tell = h("div"), controls = h("div", {class: "row", style: "margin-top:10px"});
  let ticking = null;
  function show(scene) {
    clearInterval(ticking);
    if (!scene.ok) { fill(stage); fill(controls); fill(tell, h("div", {class: "banner bad"}, "The scene cannot be played yet:"), scene.problems.map(problem => h("div", {class: "item"}, problem))); return; }
    const parsed = new DOMParser().parseFromString(scene.svg, "image/svg+xml");
    const svg = document.importNode(parsed.documentElement, true); svg.removeAttribute("width"); svg.removeAttribute("height");
    fill(stage, svg);
    const slider = h("input", {type: "range", min: "0", max: String(scene.seconds), step: "0.02", value: "0", style: "flex:1"}), clock = h("span", {class: "hint", style: "min-width:74px"});
    const at = () => { clock.textContent = svg.getCurrentTime().toFixed(1) + " of " + scene.seconds + " s"; };
    const play = h("button", {class: "quiet", onclick: () => { if (svg.animationsPaused()) { if (svg.getCurrentTime() >= scene.seconds) svg.setCurrentTime(0); svg.unpauseAnimations(); play.textContent = "Pause"; } else { svg.pauseAnimations(); play.textContent = "Play"; } }}, "Pause");
    slider.addEventListener("input", () => { svg.pauseAnimations(); play.textContent = "Play"; svg.setCurrentTime(Number(slider.value)); at(); });
    ticking = setInterval(() => { if (!svg.isConnected) { clearInterval(ticking); return; } if (!svg.animationsPaused()) { slider.value = String(Math.min(svg.getCurrentTime(), scene.seconds)); at(); } }, 80);
    const again = h("button", {class: "quiet", onclick: () => { svg.setCurrentTime(0); svg.unpauseAnimations(); play.textContent = "Pause"; }}, "From the start");
    const keep = h("button", {class: "quiet", onclick: () => { const link = h("a", {href: URL.createObjectURL(new Blob([scene.page], {type: "text/html"})), download: agent.title + ".html"}); link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 4000); }}, "Save as a web file");
    svg.setCurrentTime(0); at();
    fill(controls, play, again, slider, clock, keep);
    fill(tell, h("div", {class: "hint", style: "margin-top:8px"}, scene.shapes + " shape(s), " + scene.moves + " move(s). The description was checked before it was drawn. Drag the slider to look at any moment."));
  }
  async function make() {
    let inputs; try { inputs = JSON.parse(given.value || "{}"); } catch (error) { fill(tell, h("div", {class: "banner bad"}, "What you give it is not valid JSON: " + error.message)); return; }
    fill(tell, h("p", {class: "lead"}, h("span", {class: "spin"}), "Making the scene"));
    try { show(await api("/api/scene?id=" + encodeURIComponent(agent.id), {method: "POST", body: JSON.stringify({inputs})})); } catch (error) { fill(stage); fill(controls); fill(tell, h("div", {class: "banner bad"}, error.message)); }
  }
  make();
  return h("div", {class: "map"}, h("div", {class: "panel"}, h("h4", null, "The scene"), stage, controls, tell),
    h("div", {class: "panel"}, h("h4", null, "What you give it"), given, h("div", {class: "row", style: "margin-top:8px"}, h("button", {onclick: make}, "Make the scene again"), h("span", {class: "hint"}, "Change a number and make it again. Only plain code runs: no model, no tools."))));
}

// The Session tab: what an agent changed in its own copy of the folder, and
// the one decision that brings it into the real folder or throws it away.
function sessionTab(agent) {
  const box = h("div", {class: "map"}, h("p", {class: "lead"}, h("span", {class: "spin"}), "Looking in the session"));
  const words = {new: "new file", changed: "changed", removed: "removed"};
  const load = () => api("/api/session?id=" + encodeURIComponent(agent.id)).then(draw).catch(error => fill(box, h("div", {class: "banner bad"}, error.message)));
  async function end(keep) {
    try { const done = await api("/api/session?id=" + encodeURIComponent(agent.id), {method: "POST", body: JSON.stringify({keep})});
      fill(box, h("div", {class: "banner ok"}, keep ? done.applied.length + " file(s) were brought into the real folder. The session is closed." : "The session was thrown away. The real folder was not touched."), h("button", {class: "quiet", onclick: load}, "Look again"));
    } catch (error) { fill(box, h("div", {class: "banner bad"}, error.message)); }
  }
  function draw(view) {
    if (!view.open) { fill(box, h("div", {class: "panel"}, h("h4", null, "Session"), h("div", {class: "purpose"}, "No session is open for this agent."), h("div", {class: "foot", style: "margin-top:6px"}, "One opens the first time the agent runs. It is a copy of the granted folder; the agent works there, behind a wall.")), h("button", {class: "quiet", onclick: load}, "Look again")); return; }
    fill(box,
      h("div", {class: "panel"}, h("h4", null, "Waiting in the session"),
        h("div", {class: "purpose"}, view.count ? view.count + " file(s) differ from " + view.folder : "Nothing differs from " + view.folder),
        h("div", {class: "foot", style: "margin:6px 0 10px"}, "None of this is in the real folder yet. Read the list before you bring it back: what you bring back is as real as if you had written it."),
        view.changes.map(change => { const body = h("div", {class: "difflines"}); let asked = false;
          const open = async event => { if (!event.target.open || asked) return; asked = true; fill(body, h("span", {class: "spin"}));
            try { const shown = await api("/api/session/file?id=" + encodeURIComponent(agent.id) + "&path=" + encodeURIComponent(change.path));
              fill(body, shown.lines.map(line => h("div", {class: line.startsWith("+") ? "add" : line.startsWith("-") ? "cut" : line.startsWith("@@") ? "at" : ""}, line || " ")), shown.note ? h("div", {class: "at"}, shown.note) : null, !shown.lines.length && !shown.note ? h("div", {class: "at"}, "An empty file.") : null);
            } catch (error) { fill(body, h("div", {class: "cut"}, error.message)); } };
          return h("details", {class: "item", ontoggle: open}, h("summary", null, h("span", {class: "from"}, words[change.kind] + (change.kind === "removed" ? "" : ", " + change.bytes + " bytes")), h("b", null, change.path)), body); }),
        view.count > view.changes.length ? h("div", {class: "foot"}, "And " + (view.count - view.changes.length) + " more.") : null),
      h("div", {class: "row"}, view.count ? h("button", {onclick: () => end(true)}, "Bring these into the real folder") : null, h("button", {class: "quiet", onclick: () => end(false)}, "Throw the session away"), h("button", {class: "quiet", onclick: load}, "Look again")));
  }
  load();
  return box;
}

// The Map tab: what this agent is for, what it may touch and what it does.
// Every line says where it comes from. Nothing here is written by a model.
const MAP_FROM = {checked: "from the program", comment: "from the comment at the top of the file", person: "written by a person"};
function mapTab(agent) {
  const box = h("div", {class: "map"}, h("p", {class: "lead"}, h("span", {class: "spin"}), "Drawing the map"));
  const where = item => item.line ? "line " + item.line : "";
  const entry = item => h("div", {class: "item"}, h("span", {class: "from"}, [MAP_FROM[item.source], where(item)].filter(Boolean).join(", ")),
    h("b", null, item.name), " ", item.does, item.needs ? h("span", {class: "small"}, "Needs: " + item.needs) : null, item.unseen ? h("span", {class: "small"}, item.unseen) : null);
  const panel = (title, items, none, extra) => h("div", {class: "panel" + (extra || "")}, h("h4", null, title), items.length ? items.map(entry) : h("div", {class: "empty"}, none));
  const shape = fields => fields.length ? fields.map(f => f.name + " (" + f.type + ")").join(", ") : "";
  // A line that opens to show the steps of the workflow it runs.
  const inner = step => h("div", {class: "in"}, h("b", null, step.name), " ", step.does, (step.notes || []).map(line => h("span", {class: "small"}, line)));
  const within = (title, steps) => (steps || []).length ? h("details", null, h("summary", null, title), steps.map(inner)) : h("div", {class: "choice"}, title);
  function draw(map) {
    const note = h("input", {type: "text", maxlength: "600", placeholder: "One sentence: what is this agent for?"}); note.value = map.purpose.source === "person" ? map.purpose.text : "";
    const say = h("span", {class: "say"});
    const keep = async () => { say.textContent = "Saving"; try { draw(await api("/api/purpose?id=" + encodeURIComponent(agent.id), {method: "POST", body: JSON.stringify({text: note.value})})); } catch (error) { say.textContent = error.message; } };
    const purpose = h("div", {class: "panel"}, h("h4", null, "What it is for"),
      h("div", {class: "purpose"}, map.purpose.text || "No purpose written yet."),
      h("div", {class: "foot", style: "margin:6px 0 10px"}, map.purpose.source === "none" ? "Kosika does not guess a purpose. Write one below." : MAP_FROM[map.purpose.source] + "."),
      h("div", {class: "row"}, note, h("button", {class: "quiet", onclick: keep}, "Save note"), say));
    const flow = h("div", {class: "panel"}, h("h4", null, "In and out"),
      map.has_main ? [h("div", {class: "item"}, h("b", null, "You give it "), map.given.length ? map.given.map(g => g.name + ": " + (shape(g.fields) || g.type)).join("; ") : "nothing"),
        h("div", {class: "item"}, h("b", null, "It gives back "), shape(map.gives.fields || []) || map.gives.type || "nothing")] : h("div", {class: "empty"}, "This program has no main workflow to run."),
      map.budget.length ? h("div", {class: "item"}, h("b", null, "Its own limit "), map.budget.map(([kind, amount]) => amount + " " + kind.replace("_", " ")).join(", ")) : null);
    const models = [...map.models, ...map.thinking.map(verb => ({name: verb, does: "is asked of whichever model you start Studio with", source: "checked"}))];
    const steps = h("div", {class: "panel"}, h("h4", null, "What it does, in order"),
      map.steps.length ? map.steps.map((step, index) => h("div", {class: "step"}, h("span", {class: "n"}, index + 1),
        h("div", null, h("b", null, step.name), " ", step.does, step.line ? h("span", {class: "foot"}, "  line " + step.line) : null,
          (step.choices || []).map(choice => within("When it is " + choice.when + ": " + choice.does, choice.inside)),
          step.inside ? within("Inside that workflow", step.inside) : null,
          (step.notes || []).map(line => h("span", {class: "small", style: "display:block;color:var(--soft);font-size:12.5px"}, line))))) : h("div", {class: "empty"}, "No steps to show."),
      map.more_steps ? h("div", {class: "foot"}, "And " + map.more_steps + " more step(s). See the Workflow tab for all of them.") : null,
      map.other_workflows.length ? h("div", {class: "foot", style: "margin-top:8px"}, "Other workflows it can run: " + map.other_workflows.join(", ") + ".") : null);
    const c = map.coverage;
    fill(box, purpose, flow,
      h("div", {class: "cols"}, panel("It only looks at", map.reads, "Nothing outside itself."),
        panel("It may change (asks you first, every time)", map.changes, "Nothing. It cannot change anything."),
        panel("It asks these models", models, "None. It is plain code."),
        panel("It remembers", map.memories, "Nothing between runs.")),
      map.outside.length ? panel("It looks through things Kosika cannot see inside", map.outside, "", " unseen") : null,
      steps,
      h("div", {class: "foot"}, "This map holds " + c.checked + " item(s) read from the checked program, " + (c.person + c.comment) + " written by a person, and " + c.unseen + " that reach where Kosika cannot see. No model wrote any of it."));
  }
  api("/api/map?id=" + encodeURIComponent(agent.id)).then(draw).catch(error => fill(box, h("div", {class: "banner bad"}, error.message)));
  return box;
}

async function showAgent(id, isAssistant) {
  main.replaceChildren(h("p", {class: "lead"}, h("span", {class: "spin"}), "Loading"));
  const agent = await api("/api/agent?id=" + encodeURIComponent(id));
  const head = [isAssistant ? null : h("span", {class: "back", onclick: () => go("agents")}, "← All agents"), h("h1", null, isAssistant ? "Assistant" : agent.title),
    h("p", {class: "lead"}, agent.about || "No description. Add a // comment at the top of the file.")];
  if (agent.error) { fill(main, head, h("div", {class: "banner bad"}, "This program does not check: " + agent.error), agent.source != null ? codeTab(agent) : null); return; }
  const parts = () => h("div", {class: "facts", style: "margin-top:0"},
    fact("Models it asks", agent.models.map(m => m + (m === agent.default_model ? " (default)" : "")), "none: this agent is plain code"),
    fact("What it remembers", agent.memories.map(m => m.name + ", holding " + m.record), "nothing between runs"),
    (agent.boards || []).length ? fact("Where its agents talk", agent.boards.map(b => "board " + b.name + ", messages of " + b.record), "") : null,
    fact("Tools it may use", agent.tools.map(t => t.name + (t.changes ? " (asks you first)" : " (read-only)")), "none"),
    agent.agents.length ? fact("Agents inside", agent.agents.map(a => a.name + (a.can.length ? " may use " + a.can.join(", ") : "")), "") : null,
    agent.swarms.length ? fact("Swarms", agent.swarms.map(s => s.name + ": " + s.agents.join(", ") + " on " + s.workflow + ", up to " + s.max_rounds + " rounds"), "") : null,
    fact("Code functions", agent.functions, "none"),
    fact("Budget", agent.budget.map(([kind, amount]) => amount + " " + kind.replace("_", " ")), "none declared"),
    fact("Fingerprint", [agent.program_hash.slice(0, 16) + "…"], ""));
  let tabs = {"Live": a => liveTab(a, isAssistant), "Map": mapTab, "Workflow": workflowTab, "Parts": parts, "Data": dataTab, "Tests": testsTab, "Runs": a => runsPanel(a.id, a.traces), "Code": codeTab};
  if (agent.swarms.length) tabs = {"Live": tabs.Live, "Swarm": swarmTab, ...tabs};
  if (overview && overview.sessions) tabs = {...tabs, "Session": sessionTab};
  if (agent.scene) tabs = {"Scene": sceneTab, ...tabs};
  // A program that is only a swarm has no main to talk to or run.
  if (!agent.has_main) delete tabs.Live;
  const area = h("div"); const bar = h("div", {class: "tabs"}); const built = {};
  async function pick(name) {
    for (const tab of bar.children) tab.className = "tab" + (tab.textContent === name ? " on" : "");
    if (name === "Runs") { try { agent.traces = (await api("/api/agent?id=" + encodeURIComponent(id))).traces; } catch (error) { /* keep the old list */ } built.Runs = null; }
    if (name === "Session") built.Session = null;
    if (!built[name]) built[name] = tabs[name](agent);
    area.replaceChildren(built[name]);
  }
  for (const name of Object.keys(tabs)) bar.append(h("div", {class: "tab", onclick: () => pick(name)}, name));
  fill(main, head, h("div", {class: "chips"}, badges(agent)), bar, area);
  pick(Object.keys(tabs)[0]);
}

route();
