function liveView(agent, entry) {
  const byName = Object.fromEntries(agent.workflows.map(w => [w.name, w]));
  let writing = "", picked = [];
  const root = h("div", {class: "live"});
  const tally = h("div", {class: "tally"});
  const stage = runStage(agent);
  const box = h("div", null, stage.el, root, tally);
  let frames = [], counts = null, began = 0;
  function showTally(finished) {
    const seconds = Math.round((performance.now() - began) / 100) / 10;
    fill(tally, h("span", null, h("b", null, counts.steps), " steps"), h("span", null, h("b", null, counts.models), " model calls"),
      h("span", null, h("b", null, counts.tools), " tool or memory calls"), counts.tokens ? h("span", null, h("b", null, counts.tokens), " tokens") : null,
      began ? h("span", null, h("b", null, seconds), " s" + (finished ? "" : " so far")) : null);
  }
  function redraw() {
    const top = drawWorkflow(byName[entry || "main"] || agent.workflows[0]);
    root.replaceChildren(top.flow);
    frames = [{nodes: top.nodes, current: null}];
  }
  function reset(starting) {
    redraw();
    counts = {models: 0, tools: 0, steps: 0, tokens: 0}; began = starting ? performance.now() : 0; showTally(false);
    stage.reset(starting);
  }
  function say(depth, text) { const frame = frames[depth]; if (frame && frame.current) frame.current.now.textContent = text; }
  function apply(event) {
    if (event.event === "model_text") {
      // The words arrive as the model writes them; show the latest under
      // the step that asked.
      writing += event.text;
      const asking = [...frames].reverse().find(item => item.current);
      const words = (partial(writing) || writing).replace(/\s+/g, " ");
      if (asking) asking.current.now.textContent = "writing: " + (words.length > 90 ? "…" + words.slice(-90) : words);
      return;
    }
    stage.apply(event);
    const depth = event.depth || 0, frame = frames[depth];
    if (!frame) return;
    if (event.event === "model_call") writing = "";
    if (event.event === "step_start") {
      const node = frame.nodes[event.step]; if (!node) return;
      // A run that carried on after an approval does not repeat the steps it
      // had already finished, so everything before this step is done.
      for (const earlier of Object.values(frame.nodes)) { if (earlier === node) break; if (!earlier.el.classList.contains("failed")) earlier.el.classList.add("done"); }
      frame.current = node; node.started = performance.now();
      // A step of plain code makes no call of its own to show, so the
      // diagram is told here.
      if (node.kind === "code") stage.apply({event: "code_step"});
      node.el.classList.remove("done", "failed", "waiting"); node.el.classList.add("running");
      node.now.textContent = event.recovered ? "the first attempt failed, running the fallback" : "";
      // Follow the running step inside the flow's own box; the page stays put.
      const at = node.el.getBoundingClientRect(), view = root.getBoundingClientRect();
      if (at.top < view.top || at.top + 90 > view.bottom) root.scrollTo({top: root.scrollTop + at.top - view.top - 50, behavior: "smooth"});
      counts.steps += 1;
    } else if (event.event === "model_call") { counts.models += 1; say(depth, "asking the model…"); }
    else if (event.event === "agent_call") { counts.models += 1; picked = []; say(depth, "agent " + event.agent + (event.skills && event.skills.length ? " picked " + (event.skills.length === 1 ? "the skill " : "the skills ") + event.skills.join(", ") + " and" : "") + " is thinking…"); }
    else if (event.event === "agent_tool") {

    else if (event.event === "agent_return") { if (event.tokens) counts.tokens += event.tokens; say(depth, "agent " + (event.agent || "") + " answered" + (picked.length ? " after choosing " + picked.join(" → ") : "")); }
    else if (event.event === "model_return") {

      const bits = [event.learned ? "answered from what it learned, with no model (" + (event.learned === "same" ? "asked before" : event.learned === "close" ? "asked nearly the same before" : "its examples agree") + ")" : event.escalated ? "model " + event.escalated + " answered, after the first model's answer was refused" : "the model answered"]; if (event.rejected) bits.push(event.rejected + " answer(s) rejected first");

// ------------------------------------------------- running, with the live view
async function follow(agent, body, live, onAsk, onWrite, path) {
  const started = await api((path || "/api/start") + "?id=" + encodeURIComponent(agent.id), {method: "POST", body: JSON.stringify(body)});
  const run = encodeURIComponent(started.run);
  live.reset(true); let since = 0, asked = false, raw = "", clock = null, shown = 0;
  for (;;) {
    const view = await api("/api/poll?run=" + run + "&since=" + since);
    since = view.next;
    for (const event of view.events) {
      // Each event is shown when it really happened, counted from the start
      // of the run. Events that arrive late (the page asks every so often)
      // are caught up quickly but keep their order and their spacing, a
      // little squeezed, so a slow step still looks slow and a fast one fast.
      if (typeof event.at === "number") {
        if (clock === null) clock = performance.now() - event.at * 1000;
        const wait = clock + event.at * 1000 - performance.now();
        if (wait > 0) await sleep(Math.min(wait, 4000));
        else if (wait < -1500) clock += Math.min(-wait - 1500, 400);
        if (event.event !== "model_text" && performance.now() - shown < 28) await sleep(28);
        shown = performance.now();
      }
      live.apply(event);
      if (event.event === "model_call") raw = "";
      if (event.event === "model_text") { raw += event.text; if (onWrite) onWrite(partial(raw)); continue; }
    }
    if (view.state === "waiting" && !asked) {
      asked = true;
      onAsk(view.request || {}, async allow => { await api("/api/decide?run=" + run, {method: "POST", body: JSON.stringify({allow})}); await sleep(400); asked = false; });
    }
    if (view.state === "done" || view.state === "failed" || view.state === "refused") { live.finish(view.state !== "done"); return view; }
    await sleep(view.events.length ? 60 : 250);
  }
}

function storySteps(steps) {
  const box = h("div", {class: "story"});
  steps.forEach((step, index) => {
    const row = h("div", {class: "s"}, h("div", {class: "head"}, (index + 1) + ". " + step.name + ": " + step.did, step.seconds ? h("span", {class: "t"}, step.seconds + " s") : null));
    if (step.fallback) row.append(h("div", {class: "note bad"}, "First attempt failed: " + step.fallback + " The fallback ran instead."));
    if (step.escalated) row.append(h("div", {class: "note v"}, step.escalated.charAt(0).toUpperCase() + step.escalated.slice(1)));
    for (const reason of step.rejected || []) row.append(h("div", {class: "note bad"}, "Rejected, then asked again: " + reason));
    if (step.vote) row.append(h("div", {class: "note v"}, "Vote: " + step.vote));
    for (const use of step.used || []) row.append(h("div", {class: "note v"}, "It chose " + use));
    if (step.reshaped) row.append(h("div", {class: "note"}, "It first answered in plain words, then put that into the record."));
    if ((step.inside || []).length) row.append(h("div", {class: "inside"}, storySteps(step.inside)));
    if (step.answer != null) row.append(h("div", {class: "ans"}, "→ " + step.answer));
    for (const quote of step.evidence || []) row.append(h("div", {class: "note q"}, "Backed by " + quote));
    if (step.unfinished) row.append(h("div", {class: "note bad"}, "This step did not finish."));
    box.append(row);
  });
  return box;
}
// Every step of a run, with the steps of the workflows it called.
const everyStep = steps => steps.flatMap(step => [step, ...everyStep(step.inside || [])]);

function storyView(story) {
  const box = storySteps(story.steps);
  const cost = [];
  if (story.used && story.used.model_calls != null) cost.push(story.used.model_calls + " model call(s)" + (story.limits && story.limits.max_model_calls ? " of " + story.limits.max_model_calls + " allowed" : ""));
  if (story.used && story.used.tool_calls) cost.push(story.used.tool_calls + " tool or memory call(s)");
  if (story.tokens) cost.push(story.tokens + " tokens");
  if (story.seconds != null) cost.push(Math.round(story.seconds * 10) / 10 + " seconds");
  return h("div", null,
    story.finished ? null : h("div", {class: "banner bad"}, "The run stopped before finishing: " + (story.error || "no reason recorded")),
    h("div", {class: "banner " + (story.replays ? "ok" : "warn")}, story.replays ? "This run replays: what you see is exactly what was recorded." : "Careful: this run does not replay. " + (story.replay_problem || "")),
    box, cost.length ? h("p", {class: "lead", style: "margin-top:10px"}, "Cost: " + cost.join(", ")) : null);
}

function requestsView(story) {

function highlight(source) {

  const words = /^(record|fn|workflow|model|default|memory|board|tool|agent|swarm|test|let|var|return|if|else|for|in|while|repeat|times|match|case|classify|extract|summarize|decide|recall|remember|post|read|under|into|from|given|using|with|evidence|vote|retry|otherwise|budget|expect|answers|call|execute|ask|use_model|require|approval|import|export|and|or|not|true|false|null|until|to|as|where)$/;

    if (step.kind === "model" || step.kind === "think" || step.kind === "agent") return [{event: "model_call", model: step.model || ""}, {event: "model_return"}];

// ------------------------------------------------------ one agent, live
function liveTab(agent, isAssistant) {
  const live = liveView(agent);
  const side = h("div");

  const panes = {"Live": live.el, "What it did": h("p", {class: "empty"}, "Nothing has run yet."), "Requests": h("p", {class: "empty"}, "Nothing has run yet."), "Memory": h("div")};

    if (name === "Memory") memoryView(agent, panes.Memory);

  const left = h("div", {class: "panel"});

    const orbName = isAssistant ? h("div", {class: "orb-name"}, "") : null;

    const send = async (given, quiet) => {
      const text = (typeof given === "string" ? given : input.value).trim();
      if (!text || busy) return;

      mood("thinking");

      const waiting = h("div", {class: "msg"}, h("div", {class: "bubble typing"}, h("span"), h("span"), h("span")));
      log.append(waiting); log.scrollTop = log.scrollHeight;
      const answer = (text, meta, bad) => waiting.replaceChildren(h("div", {class: "bubble"}, bad ? h("span", {style: "color:var(--bad)"}, text) : text, meta ? h("span", {class: "meta"}, meta) : null));

        log.append(h("div", {class: "msg"}, h("div", {class: "bubble"}, words, h("span", {class: "meta"}, "due at " + item.at))), h("div", {class: "suggest"}, h("span", {onclick: () => send("my reminders")}, "my reminders")));

    const quick = isAssistant ? h("div", {class: "quick"}, ["what can you do", "what time is it", "my reminders", "what do you remember"].map(text => h("span", {onclick: () => send(text)}, text))) : null;

    const spot = h("div", {class: "spot"}); document.body.append(spot);
    let x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y, running = false;
    function frame() {
      x += (tx - x) * 0.12; y += (ty - y) * 0.12;
      spot.style.transform = "translate3d(" + (x - 280) + "px," + (y - 280) + "px,0)";
      if (Math.abs(tx - x) + Math.abs(ty - y) > 0.5) requestAnimationFrame(frame); else running = false;
    }
    window.addEventListener("pointermove", event => {
      tx = event.clientX; ty = event.clientY; document.body.classList.add("lit");
      if (!running) { running = true; requestAnimationFrame(frame); }
    }, {passive: true});
    document.addEventListener("pointerleave", () => document.body.classList.remove("lit"));
  }

  // The rail's lit pill glides to the open view.
  function railPill() {
    const nav = document.getElementById("nav");
    const pill = h("div", {class: "nav-pill"});
    function place() {
      const on = nav.querySelector(".nav.on");
      if (!on) { pill.style.opacity = "0"; return; }
      if (!pill.isConnected) nav.prepend(pill);
      pill.style.opacity = "1";
      pill.style.height = on.offsetHeight + "px";
      pill.style.transform = "translate3d(0," + on.offsetTop + "px,0)";
    }
    new MutationObserver(() => { requestAnimationFrame(place); setTimeout(place, 250); }).observe(nav, {childList: true});
    window.addEventListener("resize", place);
    if (document.fonts) document.fonts.ready.then(place);
    new MutationObserver(() => setTimeout(place, 60)).observe(document.documentElement, {attributes: true, attributeFilter: ["data-skin", "data-theme"]});
  }

  // Where the last click came from, so the next view can grow out of it.
  let origin = null;
  document.addEventListener("click", event => {
    const from = event.target.closest && event.target.closest(".card, .nav, .hit");
    origin = from ? from.getBoundingClientRect() : null;
    const button = event.target.closest && event.target.closest("button, .btn, .nav");
    if (button && !calm()) {
      const box = button.getBoundingClientRect();
      const ring = h("span", {class: "ripple", style: "left:" + (event.clientX - box.left) + "px;top:" + (event.clientY - box.top) + "px"});
      if (getComputedStyle(button).position === "static") button.style.position = "relative";
      button.append(ring); setTimeout(() => ring.remove(), 720);
    }
  }, true);
  window.addEventListener("hashchange", () => { if (!calm()) main.classList.add("leaving"); });

  // A new view: the part you came from carries in from where you clicked,
  // and the rest rises into place in one wave.
  function arrive() {
    main.classList.remove("leaving");
    if (calm()) return;
    const parts = [...main.children];
    parts.forEach((part, index) => { part.classList.remove("arrive"); void part.offsetWidth; part.style.setProperty("--i", Math.min(index, 8)); part.classList.add("arrive"); });
    main.querySelectorAll(".grid > .card").forEach((card, index) => { card.style.setProperty("--i", Math.min(index + 2, 14)); card.classList.add("arrive"); });
    const lead = parts[0];
    if (origin && lead) {
      const to = lead.getBoundingClientRect();
      if (to.width > 0 && to.height > 0) {
        const dx = origin.left - to.left, dy = origin.top - to.top;
        const sx = Math.max(0.2, Math.min(1, origin.width / to.width)), sy = Math.max(0.2, Math.min(1, origin.height / to.height));
        lead.classList.remove("arrive");
        lead.animate([
          {transform: "translate3d(" + dx + "px," + dy + "px,0) scale(" + sx + "," + sy + ")", opacity: 0.4, transformOrigin: "0 0", filter: "blur(2px)"},
          {transform: "none", opacity: 1, transformOrigin: "0 0", filter: "none"}
        ], {duration: 640, easing: "cubic-bezier(.16,1,.3,1)"});
      }
    }
    origin = null;
  }
  let pending = 0;
  new MutationObserver(records => {
    if (!records.some(record => record.addedNodes.length)) return;
    cancelAnimationFrame(pending); pending = requestAnimationFrame(arrive);
  }).observe(main, {childList: true});

  // Cards lean toward the pointer, and light follows it across them.
  document.addEventListener("pointermove", event => {
    const card = event.target.closest && event.target.closest(".card");
    if (!card || calm()) return;
    const box = card.getBoundingClientRect();
    const px = (event.clientX - box.left) / box.width, py = (event.clientY - box.top) / box.height;
    card.style.setProperty("--mx", (px * 100).toFixed(1) + "%"); card.style.setProperty("--my", (py * 100).toFixed(1) + "%");
    card.style.transform = "perspective(900px) rotateX(" + ((0.5 - py) * 5).toFixed(2) + "deg) rotateY(" + ((px - 0.5) * 6).toFixed(2) + "deg) translateZ(0)";
  }, {passive: true});
  document.addEventListener("pointerout", event => {
    const card = event.target.closest && event.target.closest(".card");
    if (card && !card.contains(event.relatedTarget)) card.style.transform = "";
  });

  // Film grain, drawn once on this computer: a tile of fixed noise, laid
  // over the light so the dark reads as film.
  function grain() {
    const tile = document.createElement("canvas"); tile.width = tile.height = 128;
    const paint = tile.getContext("2d"), dots = paint.createImageData(128, 128);
    let seed = 7;
    for (let i = 0; i < dots.data.length; i += 4) { seed = (seed * 16807) % 2147483647; const v = seed % 256; dots.data[i] = dots.data[i + 1] = dots.data[i + 2] = v; dots.data[i + 3] = 255; }
    paint.putImageData(dots, 0, 0);
    const sheet = document.createElement("canvas"); sheet.className = "grain";
    function size() { sheet.width = innerWidth; sheet.height = innerHeight; const ctx = sheet.getContext("2d"); ctx.fillStyle = ctx.createPattern(tile, "repeat"); ctx.fillRect(0, 0, sheet.width, sheet.height); }
    size(); window.addEventListener("resize", size); document.body.append(sheet);
  }

  intro(); spotlight(); railPill(); grain();
})();

// ------------------------------------------------- the living universe
// Studio's background is a nebula drawn on this computer's graphics card,
// and it answers what the agents do: a model thinking stirs it and turns
// it violet, a tool call sends a cyan pulse from where the pointer rests,
// a finished run blooms gold, a failed one flushes red, and idle it barely
// drifts. Without WebGL, in the light theme, or for anyone who asked for
// less motion, the still aurora above stands in.
(function nebula() {
  if (stillness.matches) return;
  const canvas = document.createElement("canvas");
  canvas.className = "nebula";
  const gl = canvas.getContext("webgl", {antialias: false, alpha: false, powerPreference: "low-power"});
  if (!gl) return;
  const vertex = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  const fragment = [
    "precision mediump float;",
    "uniform vec2 r;uniform float t;uniform float energy;uniform vec3 tint;uniform float pulse;uniform vec2 m;",
    "float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
    "float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}",
    "float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}",
    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;float s=t*(.025+.11*energy);",
    " vec2 q=vec2(fbm(uv*1.5+s),fbm(uv*1.5-s+3.1));",
    " vec2 w=vec2(fbm(uv*2.1+q*1.9+s*1.3),fbm(uv*2.1+q*1.9-s+7.4));",
    " float f=fbm(uv*1.3+w*2.1);",
    " vec3 col=mix(vec3(.025,.025,.06),vec3(.36,.24,.86),clamp(f*f*1.7,0.,1.));",
    " col=mix(col,vec3(1.,.52,.28),clamp(length(q)*.55-.18,0.,1.)*.5);",
    " col=mix(col,vec3(.3,.82,1.),clamp(w.y*w.y*1.1,0.,1.)*.32);",
    " col=mix(col,tint,.22*energy);",
    " float ring=exp(-6.*abs(length(uv-m)-pulse*1.2))*pulse;",
    " col+=tint*(exp(-3.2*length(uv-m))*(.08+.35*pulse)+ring*.9);",
    " vec2 g=floor(gl_FragCoord.xy/2.);float st=step(.9978,h(g));col+=st*(.55+.45*sin(t*1.7+h(g)*40.))*.7;",
    " vec2 v=gl_FragCoord.xy/r-.5;col*=1.-dot(v,v)*1.3;",
    " gl_FragColor=vec4(col*(.62+.3*energy),1.);}"
  ].join("\n");
  function compile(type, source) { const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader); return gl.getShaderParameter(shader, gl.COMPILE_STATUS) ? shader : null; }
  const vs = compile(gl.VERTEX_SHADER, vertex), fs = compile(gl.FRAGMENT_SHADER, fragment);
  if (!vs || !fs) return;
  const program = gl.createProgram(); gl.attachShader(program, vs); gl.attachShader(program, fs); gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return;
  gl.useProgram(program);
  const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const where = gl.getAttribLocation(program, "p"); gl.enableVertexAttribArray(where); gl.vertexAttribPointer(where, 2, gl.FLOAT, false, 0, 0);
  const u = name => gl.getUniformLocation(program, name);
  const uR = u("r"), uT = u("t"), uE = u("energy"), uTint = u("tint"), uPulse = u("pulse"), uM = u("m");
  document.body.prepend(canvas);
  document.body.classList.add("has-nebula");

  // Half resolution: a nebula is soft, and the card is spared.
  function size() { canvas.width = Math.max(2, Math.round(innerWidth / 2)); canvas.height = Math.max(2, Math.round(innerHeight / 2)); gl.viewport(0, 0, canvas.width, canvas.height); }
  size(); window.addEventListener("resize", size);

  const TINTS = {idle: [0.66, 0.58, 1.0], think: [0.66, 0.5, 1.0], tool: [0.33, 0.84, 1.0], ok: [1.0, 0.78, 0.35], bad: [1.0, 0.36, 0.45], you: [1.0, 0.54, 0.3]};
  let energy = 0.15, wantEnergy = 0.15, tint = TINTS.idle.slice(), wantTint = TINTS.idle, pulse = 0, mx = 0, my = 0, calmUntil = 0;
  function stir(kind, strength) {
    wantTint = TINTS[kind] || TINTS.idle; pulse = Math.max(pulse, strength);
    wantEnergy = kind === "think" ? 0.95 : kind === "ok" || kind === "bad" ? 0.7 : Math.max(wantEnergy, 0.55);
    calmUntil = performance.now() + (kind === "think" ? 6000 : 2200);
  }
  document.addEventListener("kosika:event", event => {
    const kind = event.detail;
    if (kind === "model_call" || kind === "agent_call") stir("think", 0.55);
    else if (kind === "tool_call" || kind === "agent_tool") stir("tool", 0.8);
    else if (kind === "run_done") stir("ok", 1);
    else if (kind === "run_failed") stir("bad", 1);
    else if (kind === "run_start") stir("you", 0.7);
  });
  window.addEventListener("pointermove", event => { mx = (event.clientX - innerWidth / 2) / innerHeight; my = (innerHeight / 2 - event.clientY) / innerHeight; }, {passive: true});

  const start = performance.now(); let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden || now - last < 33) return;
    const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
    const look = document.documentElement.dataset.skin;
    if (look === "swiss" || look === "spy") return;
    TINTS.idle = look === "hologram" ? [0.31, 0.85, 1.0] : [0.66, 0.58, 1.0];
    if (now > calmUntil) { wantEnergy = look === "hologram" ? 0.08 : 0.15; wantTint = TINTS.idle; }
    energy += (wantEnergy - energy) * Math.min(1, dt * 1.6);
    for (let i = 0; i < 3; i++) tint[i] += (wantTint[i] - tint[i]) * Math.min(1, dt * 2);
    pulse *= Math.pow(0.18, dt);
    const light = document.documentElement.getAttribute("data-theme") === "light";
    canvas.style.opacity = light ? "0" : "1";
    if (light) return;
    gl.uniform2f(uR, canvas.width, canvas.height); gl.uniform1f(uT, (now - start) / 1000);
    gl.uniform1f(uE, energy); gl.uniform3f(uTint, tint[0], tint[1], tint[2]); gl.uniform1f(uPulse, pulse); gl.uniform2f(uM, mx, my);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
})();

// ------------------------------------------------- skins
// Four looks: Cinema (the nebula), and three from LemoLab's film styles.
// The choice is this person's and stays on this computer.
const SKINS = [["cinema", "Cinema"], ["hologram", "Hologram HUD"], ["swiss", "Swiss Motion"], ["spy", "Spy Titles"]];
function skin() { try { return localStorage.getItem("kosika-skin") || "spy"; } catch (error) { return "spy"; } }
function setSkin(name) {
  try { localStorage.setItem("kosika-skin", name); } catch (error) { /* this visit only */ }
  if (name === "cinema") delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin = name;
}
setSkin(skin());
(function skinSwitch() {
  const foot = document.getElementById("foot");
  function add() {
    if (foot.querySelector(".skin-switch")) return;
    const label = SKINS.find(item => item[0] === skin()) || SKINS[0];
    foot.append(h("div", {class: "theme skin-switch", title: "Change Studio's look", onclick: () => {
      const next = SKINS[(SKINS.findIndex(item => item[0] === skin()) + 1) % SKINS.length][0];
      setSkin(next); foot.querySelector(".skin-switch").remove(); add();
    }}, h("i"), "Look: " + label[1]));
  }
  new MutationObserver(add).observe(foot, {childList: true});
})();

// ------------------------------------------------- the agency (Spy Titles)
// What the look adds to the page: the credits, case files with stamps,
// titles cut from paper, the brass-stab cut between views, and the agent
// who runs while a mission does. It decorates what the views draw and
// changes none of it; in any other look all of it is hidden.
(function agency() {
  const spy = () => document.documentElement.dataset.skin === "spy";
  const calm = () => stillness.matches;

  // An agent in a hat and coat, cut from paper, with a red scarf.
  const runner = s("svg", {viewBox: "0 0 70 96", class: "runner spy-only", "aria-hidden": "true"},
    s("polygon", {class: "leg a", points: "30,58 38,58 40,92 31,92", fill: "#1b1714"}),
    s("polygon", {class: "leg b", points: "34,58 42,58 44,92 35,92", fill: "#2a241f"}),
    s("polygon", {class: "arm a", points: "26,30 33,30 31,58 24,58", fill: "#2a241f"}),
    s("polygon", {points: "24,26 48,26 52,64 20,64", fill: "#1b1714"}),
    s("polygon", {class: "arm b", points: "40,30 47,30 49,58 42,58", fill: "#1b1714"}),
    s("polygon", {class: "scarf", points: "30,25 46,24 14,34 10,30", fill: "#d23a22"}),
    s("circle", {cx: 37, cy: 17, r: 8, fill: "#1b1714"}),
    s("polygon", {points: "24,12 50,12 46,8 44,2 31,2 28,8", fill: "#1b1714"}),
    s("rect", {x: 22, y: 11, width: 30, height: 2.4, fill: "#e2a52a"}));
  document.body.append(runner, h("div", {class: "track spy-only"}));
  document.addEventListener("kosika:event", event => {
    if (event.detail === "run_start") document.body.classList.add("on-mission");
    if (event.detail === "run_done" || event.detail === "run_failed") setTimeout(() => document.body.classList.remove("on-mission"), 900);
  });

  // The brass stab between views.
  window.addEventListener("hashchange", () => {
    if (!spy() || calm()) return;
    const stab = h("div", {class: "stab spy-only"}, h("i"), h("i"), h("i"));
    document.body.append(stab); setTimeout(() => stab.remove(), 800);
  });

  function credits() {
    if (main.querySelector(".spy-marquee") || !overview) return;
    const agents = overview.agents || [];
    const tests = agents.reduce((sum, agent) => sum + (agent.tests || 0), 0);
    const line = ["<b>Kosika Studio</b> presents", agents.length + " operatives", tests + " tests on file", "a mission by <em>you</em>", "model " + (overview.model || "none"), "everything asks before it changes"];
    const span = document.createElement("span");
    for (const round of [0, 1]) line.forEach(part => {
      const bit = document.createElement("span"); bit.style.position = "static"; bit.style.animation = "none";
      const bold = part.match(/^<b>(.*)<\/b>(.*)$/), red = part.match(/^(.*)<em>(.*)<\/em>$/);
      if (bold) bit.append(h("b", null, bold[1]), bold[2]); else if (red) bit.append(red[1], h("em", null, red[2])); else bit.append(part);
      span.append(bit, "   ·   ");
    });
    main.prepend(h("div", {class: "spy-marquee spy-only", "aria-hidden": "true"}, span));
  }

  function tiles() {
    const title = main.querySelector("h1:not(.tiled)");
    if (!title || calm()) return;
    const text = title.textContent;
    title.setAttribute("aria-label", text);
    title.classList.add("tiled");
    title.replaceChildren(...[...text].map((letter, index) => h("span", {class: "tile spy-only" + (letter === " " ? " space" : ""), style: "--i:" + index, "aria-hidden": "true"}, letter === " " ? "" : letter)));
    // Outside the Spy look the plain words come back.
    const plain = h("span", {class: "untiled"}, text); title.append(plain);
  }

  function files() {
    main.querySelectorAll(".grid > .card:not(.new):not(.filed)").forEach((card, index) => {
      card.classList.add("filed");
      const name = (card.querySelector("h3") || {}).textContent || "unknown";
      const chips = [...card.querySelectorAll(".chip")].map(chip => chip.textContent);
      const care = chips.some(text => text.includes("asks before changing"));
      const cleared = chips.some(text => /\d+ tests?$/.test(text));
      card.prepend(h("div", {class: "file-strip spy-only"}, h("span", null, "File No. " + String(index + 1).padStart(3, "0")), h("span", null, "codename ", h("b", null, name))));
      card.append(h("div", {class: "clip-mark spy-only"}), h("div", {class: "stamp spy-only" + (care ? " care" : ""), style: "--i:" + index}, care ? "Handle with care" : cleared ? "Cleared" : "Unclassified"));
    });
  }

  function dress() { if (!main.children.length) return; credits(); tiles(); files(); }
  new MutationObserver(records => { if (records.some(record => record.addedNodes.length)) requestAnimationFrame(dress); }).observe(main, {childList: true});
})();
</script>
