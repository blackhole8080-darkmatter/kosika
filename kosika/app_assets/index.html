<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosika Studio</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --rail: #efece5; --ink: #1d1b18; --soft: #6c675f; --faint: #9a958b; --line: #e3dfd6;
  --accent: #b4532a; --accent-soft: #f7e7dd; --ok: #2f7d4f; --ok-soft: #e2f1e7;
  --bad: #b3382c; --bad-soft: #f8e3e0; --warn: #8a6100; --warn-soft: #f8ecd0;
  --think: #5b4bb5; --think-soft: #ebe8fa; --mem: #1f6f8b; --mem-soft: #dff0f5;
  --code: #57534a; --code-soft: #eeebe4; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --panel: #1f1e1b; --rail: #1a1917; --ink: #eceae5; --soft: #a39f96; --faint: #76726a; --line: #33312c;
    --accent: #e08a5f; --accent-soft: #3a261c; --ok: #6fc191; --ok-soft: #1b3125;
    --bad: #ec8377; --bad-soft: #3b1f1c; --warn: #e2b54a; --warn-soft: #392e13;
    --think: #a99cf0; --think-soft: #29254a; --mem: #6cc3de; --mem-soft: #17313a;
    --code: #b9b4a8; --code-soft: #2a2824;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --panel: #1f1e1b; --rail: #1a1917; --ink: #eceae5; --soft: #a39f96; --faint: #76726a; --line: #33312c;
  --accent: #e08a5f; --accent-soft: #3a261c; --ok: #6fc191; --ok-soft: #1b3125;
  --bad: #ec8377; --bad-soft: #3b1f1c; --warn: #e2b54a; --warn-soft: #392e13;
  --think: #a99cf0; --think-soft: #29254a; --mem: #6cc3de; --mem-soft: #17313a;
  --code: #b9b4a8; --code-soft: #2a2824;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
@font-face { font-family: "Figtree"; src: url("/fonts/Figtree.ttf") format("truetype"); font-weight: 300 900; font-display: swap; }
@font-face { font-family: "EB Garamond"; src: url("/fonts/EBGaramond.ttf") format("truetype"); font-weight: 400 800; font-display: swap; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 Figtree, system-ui, "Segoe UI", sans-serif; display: grid; grid-template-columns: 212px minmax(0, 1fr); }
aside.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 3px; height: 100vh; position: sticky; top: 0; align-self: start; }
.brand { font-weight: 700; font-size: 17px; padding: 2px 10px 14px; display: flex; align-items: center; gap: 9px; }
.brand .mark { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; }
.brand .mark.moving { background: none; width: 30px; height: 30px; margin: -4px -2px -4px -4px; } .mark svg, .hero svg { width: 100%; height: 100%; display: block; overflow: visible; }
.hero { width: 54px; height: 54px; flex: none; } .titled { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; } .titled h1 { margin: 0; }
/* Each page eases in, its parts one after another. */
main > * { animation: rise .42s var(--ease) both; } main > *:nth-child(2) { animation-delay: .04s; } main > *:nth-child(3) { animation-delay: .08s; } main > *:nth-child(4) { animation-delay: .12s; } main > *:nth-child(n+5) { animation-delay: .16s; }
.grid > .card { animation: rise .5s var(--ease) both; } .grid > .card:nth-child(2) { animation-delay: .05s; } .grid > .card:nth-child(3) { animation-delay: .1s; } .grid > .card:nth-child(4) { animation-delay: .15s; } .grid > .card:nth-child(5) { animation-delay: .2s; } .grid > .card:nth-child(n+6) { animation-delay: .25s; }
.map > * { animation: rise .45s var(--ease) both; } .map > *:nth-child(2) { animation-delay: .06s; } .map > *:nth-child(3) { animation-delay: .12s; } .map > *:nth-child(n+4) { animation-delay: .18s; }
.nav { position: relative; } .nav.on::before { content: ""; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); animation: grow .3s var(--ease) both; }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
button:active { transform: scale(.97); } .panel, .fact { transition: border-color .2s, box-shadow .2s; } .panel:hover, .fact:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.brand small { font-weight: 500; color: var(--soft); font-size: 17px; }
.nav { padding: 8px 10px; border-radius: 9px; cursor: pointer; color: var(--soft); font-weight: 500; display: flex; gap: 9px; align-items: center; transition: background .15s, color .15s; user-select: none; }
.nav:hover { background: var(--code-soft); color: var(--ink); } .nav.on { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rail .foot { margin-top: auto; padding: 10px; font-size: 12.5px; color: var(--soft); display: flex; flex-direction: column; gap: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; } .dot.off { background: var(--warn); }
main { padding: 22px 26px 60px; min-width: 0; }
h1 { font-size: 23px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 22px 0 9px; } p.lead { color: var(--soft); margin: 0 0 16px; max-width: 78ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 15px; cursor: pointer; transition: border-color .15s, transform .15s var(--ease); display: flex; flex-direction: column; gap: 9px; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card h3 { margin: 0; font-size: 16px; } .card .about { color: var(--soft); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.9em; }
.path { font: 11.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--code-soft); color: var(--code); white-space: nowrap; }
.chip.think { background: var(--think-soft); color: var(--think); } .chip.mem { background: var(--mem-soft); color: var(--mem); } .chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.accent { background: var(--accent-soft); color: var(--accent); }
.back { color: var(--soft); cursor: pointer; font-size: 13px; display: inline-block; margin-bottom: 8px; } .back:hover { color: var(--accent); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 16px 0; flex-wrap: wrap; }
.tab { padding: 7px 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--soft); font-weight: 500; transition: color .15s; } .tab:hover { color: var(--ink); } .tab.on { color: var(--ink); border-color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 15px; }
.split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 15px; align-items: start; } @media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 8px 15px; cursor: pointer; font-weight: 600; transition: transform .1s, opacity .15s; } button:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: default; } button.quiet { background: var(--code-soft); color: var(--ink); }
textarea, input[type=text] { width: 100%; font: 14px Figtree, system-ui, sans-serif; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .15s; }
textarea:focus, input[type=text]:focus { border-color: var(--accent); } textarea { min-height: 110px; resize: vertical; font-family: var(--mono); font-size: 13px; }
pre { margin: 0; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
pre.source { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 13px; max-height: 70vh; overflow: auto; }
.kw { color: var(--accent); font-weight: 600; } .cm { color: var(--faint); font-style: italic; } .st { color: var(--ok); }
.row { display: flex; gap: 9px; align-items: center; } .row > input { flex: 1; }
.banner { padding: 9px 13px; border-radius: 10px; margin-bottom: 12px; font-size: 13.5px; } .banner.bad { background: var(--bad-soft); color: var(--bad); } .banner.warn { background: var(--warn-soft); color: var(--warn); } .banner.ok { background: var(--ok-soft); color: var(--ok); }
.empty { color: var(--faint); font-style: italic; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* chat */
.chatlog { min-height: 260px; max-height: 58vh; overflow: auto; margin-bottom: 11px; display: flex; flex-direction: column; gap: 9px; padding-right: 4px; }
.msg { display: flex; animation: rise .28s var(--ease); } .msg.you { justify-content: flex-end; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.bubble { max-width: 84%; padding: 9px 13px; border-radius: 15px; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); word-break: break-word; }
.msg.you .bubble { background: var(--accent-soft); border-color: transparent; }
.bubble .meta { display: block; font-size: 11.5px; color: var(--faint); margin-top: 4px; }
.typing span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); margin-right: 4px; animation: bob 1s infinite; } .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
.ask { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 13px; padding: 12px 14px; animation: rise .28s var(--ease); max-width: 92%; }
.ask b { color: var(--warn); } .ask pre { color: var(--ink); margin: 7px 0 10px; background: var(--panel); border-radius: 8px; padding: 8px 10px; max-height: 180px; overflow: auto; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 9px; } .quick span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--soft); cursor: pointer; transition: border-color .15s, color .15s; } .quick span:hover { border-color: var(--accent); color: var(--accent); }

/* the flow: still and live */
.wf + .wf { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
.wf-title { font: 600 13.5px var(--mono); margin: 0 0 3px; } .wf-sub { color: var(--soft); font-size: 12.5px; margin-bottom: 12px; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 11px; position: relative; padding-bottom: 12px; }
.step::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.step::after { content: ""; position: absolute; left: 14px; top: 30px; height: 0; width: 2px; background: var(--ok); transition: height .45s var(--ease); }
.step.done::after { height: calc(100% - 30px); }
.step:last-child::before, .step:last-child::after { display: none; }
.num { width: 30px; height: 30px; border-radius: 50%; background: var(--code-soft); color: var(--code); display: grid; place-items: center; font-weight: 600; font-size: 12px; z-index: 1; transition: background .3s, color .3s, transform .3s var(--ease); }
.num.think, .num.model { background: var(--think-soft); color: var(--think); } .num.memory { background: var(--mem-soft); color: var(--mem); }
.num.workflow, .num.agent, .num.board { background: var(--accent-soft); color: var(--accent); } .num.files, .num.tool, .num.web { background: var(--warn-soft); color: var(--warn); }
.step .body { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; transition: border-color .3s, background .3s; min-width: 0; }
.step .name { font: 600 13px var(--mono); } .step .does { color: var(--soft); font-size: 12.5px; margin-top: 1px; }
.step .branch { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; margin-top: 3px; transition: opacity .3s; } .step .branch .when { font: 11.5px var(--mono); color: var(--accent); min-width: 84px; }
.step .now { font-size: 12px; margin-top: 4px; color: var(--accent); } .step .now:empty { display: none; }
.stage-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px; margin-bottom: 12px; overflow: hidden; }
.stage-svg { width: 100%; height: auto; max-height: 340px; display: block; }
.stage-line { fill: none; stroke: var(--line); stroke-width: 1.4; } .stage-box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; transition: stroke .25s, fill .25s, filter .25s; }
.stage-label { font: 600 12.5px system-ui, sans-serif; fill: var(--ink); } .stage-word { font: 10.5px system-ui, sans-serif; fill: var(--faint); } .stage-count { font: 600 11px var(--mono); fill: var(--soft); }
.stage-dot.k-think, .stage-light.k-think { fill: var(--think); } .stage-dot.k-mem, .stage-light.k-mem { fill: var(--mem); } .stage-dot.k-warn, .stage-light.k-warn { fill: var(--warn); } .stage-dot.k-code, .stage-light.k-code { fill: var(--code); }
.stage-dot.k-accent, .stage-light.k-accent { fill: var(--accent); } .stage-light.k-ok { fill: var(--ok); } .stage-light.k-bad { fill: var(--bad); } .stage-light { filter: drop-shadow(0 0 5px currentColor); }
.stage-node.lit .stage-box { stroke: var(--accent); fill: var(--accent-soft); filter: drop-shadow(0 0 7px color-mix(in srgb, var(--accent) 55%, transparent)); }
.stage-node.lit .stage-box.k-think { stroke: var(--think); fill: var(--think-soft); filter: drop-shadow(0 0 7px color-mix(in srgb, var(--think) 55%, transparent)); }
.stage-node.lit .stage-box.k-mem { stroke: var(--mem); fill: var(--mem-soft); filter: drop-shadow(0 0 7px color-mix(in srgb, var(--mem) 55%, transparent)); }
.stage-node.lit .stage-box.k-warn { stroke: var(--warn); fill: var(--warn-soft); }
.stage-node.done .stage-box { stroke: var(--ok); fill: var(--ok-soft); } .stage-node.failed .stage-box { stroke: var(--bad); fill: var(--bad-soft); } .stage-node.asking .stage-box { stroke: var(--warn); fill: var(--warn-soft); }
.replay { margin-bottom: 16px; } .replay-now { font-size: 13.5px; min-height: 22px; margin-top: 8px; } .replay-bar { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: -4px; }
.replay-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s var(--ease); }
.live { max-height: 64vh; overflow: auto; padding: 6px 6px 0 2px; }
.live .step { opacity: .5; transition: opacity .35s; } .live .step.running, .live .step.done, .live .step.failed, .live .step.waiting { opacity: 1; }
.live .step.running > .num { background: var(--accent); color: #fff; transform: scale(1.12); animation: pulse 1.3s infinite; }
.live .step.running > .body { border-color: var(--accent); background: var(--accent-soft); }
.live .step.done > .num { background: var(--ok); color: #fff; } .live .step.done > .body { border-color: var(--ok); } .live .step.done .now { color: var(--soft); }
.live .step.failed > .num { background: var(--bad); color: #fff; } .live .step.failed > .body { border-color: var(--bad); }
.live .step.waiting > .num { background: var(--warn); color: #fff; animation: pulse 1.3s infinite; } .live .step.waiting > .body { border-color: var(--warn); background: var(--warn-soft); }
.live .branch.skipped { opacity: .32; } .live .branch.taken .when { font-weight: 700; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.sub { margin-top: 9px; padding: 9px 0 0 6px; border-top: 1px dashed var(--line); animation: unfold .4s var(--ease); }
@keyframes unfold { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.sub .wf-title { font-size: 12px; color: var(--soft); margin-bottom: 8px; }
.tally { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--soft); padding: 9px 2px 0; border-top: 1px solid var(--line); margin-top: 8px; } .tally b { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.orb { position: relative; width: 132px; height: 132px; margin: 4px auto 14px; }
.orb i { position: absolute; inset: 0; border-radius: 50%; display: block; }
.orb .halo { background: radial-gradient(circle, color-mix(in srgb, var(--accent) 34%, transparent) 0%, transparent 68%); filter: blur(6px); animation: orb-breathe 5.2s ease-in-out infinite; }
.orb .ring { inset: 16px; background: conic-gradient(from 0deg, var(--accent), #e8a23a, #d9486a, #7a5bd0, var(--accent)); -webkit-mask: radial-gradient(circle, transparent 57%, #000 59%, #000 70%, transparent 72%); mask: radial-gradient(circle, transparent 57%, #000 59%, #000 70%, transparent 72%); animation: orb-turn 16s linear infinite, orb-breathe 5.2s ease-in-out infinite; }
.orb .core { inset: 47px; background: radial-gradient(circle at 38% 34%, #fff, var(--accent-soft) 55%, color-mix(in srgb, var(--accent) 45%, var(--panel)) 100%); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent); animation: orb-breathe 5.2s ease-in-out infinite; }
.orb .wave { inset: 30px; border: 2px solid var(--accent); opacity: 0; }
.orb.thinking .ring { animation: orb-turn 1.5s linear infinite; }
.orb.thinking .core { animation: orb-think 0.9s ease-in-out infinite; }
.orb.thinking .halo { animation: orb-think 0.9s ease-in-out infinite; }
.orb.speaking .ring { animation: orb-turn 7s linear infinite; }
.orb.speaking .core { animation: orb-speak 0.46s ease-in-out infinite alternate; }
.orb.speaking .wave { animation: orb-wave 1.25s ease-out infinite; }
.orb.speaking .wave.late { animation-delay: 0.62s; }
.orb.due .ring { animation: orb-turn 0.9s linear infinite; } .orb.due .wave { animation: orb-wave 0.8s ease-out infinite; }
.orb-name { text-align: center; font-size: 12.5px; color: var(--soft); margin: -6px 0 12px; letter-spacing: 0.04em; }
@keyframes orb-turn { to { transform: rotate(360deg); } }
@keyframes orb-breathe { 0%, 100% { scale: 1; opacity: 0.92; } 50% { scale: 1.045; opacity: 1; } }
@keyframes orb-think { 0%, 100% { scale: 0.86; } 50% { scale: 1.12; } }
@keyframes orb-speak { from { scale: 0.9; } to { scale: 1.28; } }
@keyframes orb-wave { 0% { scale: 0.62; opacity: 0.75; } 100% { scale: 1.75; opacity: 0; } }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; margin: -2px 0 2px; } .suggest span { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--accent); cursor: pointer; } .suggest span:hover { background: var(--accent-soft); }
.bubble.draft { color: var(--soft); } .caret { display: inline-block; width: 7px; height: 1em; background: var(--accent); margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* swarm */
.stage { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 14px 6px 6px; }
.member { width: 132px; text-align: center; padding: 10px 6px; border-radius: 13px; border: 1px solid transparent; transition: border-color .3s, background .3s, transform .3s var(--ease); }
.member.active { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); }
.face { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; font-weight: 700; color: #fff; transition: box-shadow .3s; }
.member.active .face { animation: pulse 1.3s infinite; } .member.spoke .face { box-shadow: 0 0 0 5px var(--ok-soft); }
.c0 { --who: #b4532a; } .c1 { --who: #1f6f8b; } .c2 { --who: #5b4bb5; } .c3 { --who: #2f7d4f; } .c4 { --who: #8a6100; }
.face { background: var(--who, var(--accent)); } .who { font: 600 13px var(--mono); } .doing { font-size: 12px; color: var(--accent); min-height: 1.4em; }
.round { text-align: center; font-size: 12.5px; color: var(--soft); min-height: 1.5em; }
.feed { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow: auto; margin: 10px 0; }
.post { border-left: 3px solid var(--who, var(--accent)); background: var(--bg); border-radius: 0 10px 10px 0; padding: 7px 11px; animation: rise .3s var(--ease); white-space: pre-wrap; word-break: break-word; }
.post b { display: block; font: 600 12px var(--mono); color: var(--who, var(--accent)); } .post small { color: var(--faint); }

/* editor */
.map { display: grid; gap: 14px; } .map h4 { margin: 0 0 7px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); }
.map .purpose { font-size: 16px; line-height: 1.45; } .map .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px; }
.map .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.map .item { padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; } .map .item:first-of-type { border-top: 0; }
.map .item .from { float: right; font-size: 11px; color: var(--faint); margin-left: 8px; } .map .item .small { display: block; color: var(--soft); font-size: 12px; }
.map .unseen { border-style: dashed; } .map .step { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.map .step:first-of-type { border-top: 0; } .map .step .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.map details, .map .choice { font-size: 12.5px; color: var(--soft); margin-top: 4px; } .map summary { cursor: pointer; } .map .choice { padding-left: 14px; }
.map .in { margin: 4px 0 4px 16px; padding-left: 10px; border-left: 2px solid var(--line); color: var(--ink); } .map .in .small { display: block; color: var(--soft); }
.map details.item { color: var(--ink); font-size: 13.5px; margin: 0; } .difflines { font: 12px/1.5 var(--mono); margin: 8px 0 4px; padding: 8px 10px; background: var(--bg); border-radius: 8px; overflow-x: auto; white-space: pre; }
.difflines .add { color: var(--ok); } .difflines .cut { color: var(--bad); } .difflines .at { color: var(--faint); }
.map .empty { color: var(--faint); font-size: 13px; } .map .foot { color: var(--faint); font-size: 12px; }
.stage { background: var(--bg); border-radius: 10px; overflow: hidden; display: grid; place-items: center; min-height: 120px; } .stage svg { width: 100%; height: auto; max-height: 62vh; display: block; }
.offers { min-height: 30px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; } .hint { color: var(--faint); font-size: 12px; }
.offer { font: 12.5px var(--mono); padding: 3px 9px; border-radius: 7px; background: var(--code-soft); color: var(--ink); cursor: pointer; } .offer.first { background: var(--accent-soft); color: var(--accent); }
.offer i { font: 11px system-ui, sans-serif; color: var(--faint); font-style: normal; }
.theme { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 7px; padding: 5px 8px; margin: 0 -8px; border-radius: 8px; } .theme:hover { background: var(--code-soft); color: var(--ink); }
.theme i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; background: linear-gradient(90deg, currentColor 50%, transparent 50%); flex: none; }
.veil { position: fixed; inset: 0; background: color-mix(in srgb, #000 45%, transparent); display: grid; place-items: start center; padding-top: 14vh; z-index: 50; animation: rise .18s var(--ease) both; }
.jump { width: min(620px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .55); overflow: hidden; }
.jump input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 15px 18px; font-size: 16px; background: transparent; } .jump input:focus { box-shadow: none; }
.jump .found { max-height: 46vh; overflow: auto; padding: 6px; } .jump .hit { padding: 8px 12px; border-radius: 9px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.jump .hit.on { background: var(--accent-soft); } .jump .hit b { font-weight: 600; } .jump .hit small { color: var(--faint); margin-left: auto; white-space: nowrap; } .jump .hit span { color: var(--soft); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jump .keys { padding: 8px 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; }
textarea.editor { min-height: 62vh; font: 12.5px/1.55 var(--mono); tab-size: 2; white-space: pre; overflow: auto; }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; } .bar .say { font-size: 13px; color: var(--soft); }
select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.card.new { cursor: default; border-style: dashed; } .card.new:hover { transform: none; }

/* story, requests, data, memory */
.story .s { padding: 9px 0; border-bottom: 1px solid var(--line); } .story .s:last-child { border: 0; }
.head { font-weight: 600; font-size: 13.5px; } .head .t { color: var(--faint); font-weight: 400; font-size: 12px; margin-left: 6px; }
.story .inside { margin: 5px 0 5px 4px; padding-left: 12px; border-left: 2px solid var(--line); }
.story .ans { margin-top: 3px; font: 12.5px var(--mono); word-break: break-word; } .note { font-size: 12.5px; margin-top: 3px; } .note.bad { color: var(--bad); } .note.q { color: var(--ok); } .note.v { color: var(--think); }
.req { border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; margin-bottom: 10px; background: var(--bg); } .req .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin: 8px 0 3px; font-weight: 600; }
.rec { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; transition: border-color .25s, box-shadow .25s; } .rec.hit { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rec h4 { margin: 0 0 6px; font: 600 13.5px var(--mono); } .rec .f { display: flex; justify-content: space-between; gap: 10px; font: 12.5px var(--mono); padding: 2px 0; } .rec .f .ty { color: var(--think); } .rec .f .ty.link { cursor: pointer; text-decoration: underline dotted; }
.memgraph { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 0 18px; align-items: start; margin-bottom: 20px; }
.memroot { background: var(--mem-soft); color: var(--mem); border-radius: 11px; padding: 10px 12px; font-weight: 600; } .memroot small { display: block; font-weight: 400; opacity: .85; }
.ment { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; margin-bottom: 8px; animation: rise .3s var(--ease); }
.ment::before { content: ""; position: absolute; left: -18px; top: 18px; width: 18px; height: 2px; background: var(--mem); opacity: .5; } .ment .k { font: 600 12.5px var(--mono); color: var(--mem); }
.runs { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 15px; } @media (max-width: 820px) { .runs { grid-template-columns: 1fr; } }
.runlist { max-height: 70vh; overflow: auto; } .runlist div { padding: 7px 10px; border-radius: 8px; cursor: pointer; font: 12px var(--mono); transition: background .15s; } .runlist div:hover, .runlist div.on { background: var(--code-soft); } .runlist small { color: var(--faint); display: block; }
.test { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; } .test:last-child { border: 0; } .test .why { color: var(--bad); font: 12.5px var(--mono); margin-top: 2px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; margin-top: 12px; } .fact { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; }
.fact b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin-bottom: 5px; font-weight: 600; } .fact .line { font-size: 13px; word-break: break-word; }
/* ---- The look: depth, type and colour, laid over the plain layout above. ---- */
:root {
  --display: "EB Garamond", Georgia, "Times New Roman", serif;
  --shadow: 0 1px 2px rgba(60, 40, 24, .06), 0 10px 26px -14px rgba(60, 40, 24, .22);
  --lift: 0 2px 4px rgba(60, 40, 24, .08), 0 20px 38px -18px color-mix(in srgb, var(--accent) 50%, transparent);
  --glow: color-mix(in srgb, var(--accent) 24%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110f0e; --panel: #1b1917; --rail: #151311; --line: #2f2b26;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 12px 30px -16px rgba(0, 0, 0, .8);
    --lift: 0 2px 4px rgba(0, 0, 0, .5), 0 22px 40px -18px color-mix(in srgb, var(--accent) 45%, transparent);
  }
}
:root[data-theme="dark"] {
  --bg: #110f0e; --panel: #1b1917; --rail: #151311; --line: #2f2b26;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 12px 30px -16px rgba(0, 0, 0, .8);
  --lift: 0 2px 4px rgba(0, 0, 0, .5), 0 22px 40px -18px color-mix(in srgb, var(--accent) 45%, transparent);
}
body {
  background:
    radial-gradient(900px 520px at 88% -12%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
    radial-gradient(760px 460px at -8% 112%, color-mix(in srgb, var(--think) 8%, transparent), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
aside.rail { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 7%, var(--rail)), var(--rail) 46%); }
.brand { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -.005em; }
.nav.on { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); }
main { padding: 26px 32px 64px; }
h1 { font: 600 33px/1.12 var(--display); letter-spacing: -.012em; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.22em; letter-spacing: -.005em; }
p.lead { font-size: 15px; line-height: 1.58; }
p.lead.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
p.lead.clamp.open { display: block; }
.card { border-radius: 16px; box-shadow: var(--shadow); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 4%, var(--panel)), var(--panel) 62%); transition: border-color .2s, transform .22s var(--ease), box-shadow .22s; }
.card:hover { box-shadow: var(--lift); transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.card.new:hover { box-shadow: var(--shadow); }
.card h3 { font: 600 19px var(--display); letter-spacing: -.005em; }
.panel, .fact, .stage-wrap { box-shadow: var(--shadow); border-radius: 15px; }
.chip { font-weight: 550; border: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
button { background: linear-gradient(180deg, color-mix(in srgb, #fff 16%, var(--accent)), var(--accent)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 8px 16px -10px var(--accent); transition: transform .1s, filter .15s, box-shadow .15s; }
button:hover:not(:disabled) { filter: brightness(1.07); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 10px 20px -10px var(--accent); }
button.quiet { background: var(--code-soft); box-shadow: none; } button.quiet:hover:not(:disabled) { box-shadow: none; filter: brightness(1.08); }
textarea, input[type=text] { transition: border-color .15s, box-shadow .15s; }
textarea:focus, input[type=text]:focus { box-shadow: 0 0 0 3px var(--glow); }
.tabs { gap: 4px; } .tab { border-radius: 8px 8px 0 0; } .tab:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.banner { box-shadow: var(--shadow); }

/* ==========================================================================
   Cinema: Studio's motion look. A dark stage lit by slow aurora light, glass
   panels that catch it, and movement that settles smoothly and never
   bounces: things arrive in a wave from below, views hand over with a short
   blur, and a soft glow blooms behind what the pointer rests on. The motion
   rules are HyperFrames' (smooth long-tail settles, overlapping cascades,
   restrained glow); everything is plain CSS and the page's own script, and
   nothing is loaded from outside. Asked for less motion, it all holds still.
   ========================================================================== */
:root:not([data-theme="light"]) {
  --bg: #07080d; --panel: rgba(20, 22, 32, .72); --rail: rgba(14, 15, 23, .66); --ink: #eef0f7; --soft: #a3a8bd; --faint: #6c7189; --line: rgba(255, 255, 255, .08);
  --accent: #ff8a4c; --accent-soft: rgba(255, 138, 76, .14); --ok: #4fe0a6; --ok-soft: rgba(79, 224, 166, .12);
  --bad: #ff6b81; --bad-soft: rgba(255, 107, 129, .13); --warn: #ffc857; --warn-soft: rgba(255, 200, 87, .12);
  --think: #a993ff; --think-soft: rgba(169, 147, 255, .14); --mem: #55d6ff; --mem-soft: rgba(85, 214, 255, .12);
  --code: #c9ccdb; --code-soft: rgba(255, 255, 255, .05);
  --glass: rgba(22, 24, 36, .62); --glass-edge: rgba(255, 255, 255, .09); --glow-a: #ff8a4c; --glow-b: #a993ff; --glow-c: #55d6ff;
  --settle: cubic-bezier(.16, 1, .3, 1); --ease: var(--settle);
}
:root[data-theme="light"] {
  --bg: #f4f2ee; --panel: rgba(255, 255, 255, .78); --rail: rgba(255, 255, 255, .7); --line: rgba(20, 20, 40, .09);
  --glass: rgba(255, 255, 255, .7); --glass-edge: rgba(20, 20, 40, .08); --glow-a: #ff8a4c; --glow-b: #8f78ff; --glow-c: #2fb7e6;
  --settle: cubic-bezier(.16, 1, .3, 1); --ease: var(--settle);
}
body { background: var(--bg); position: relative; isolation: isolate; letter-spacing: .005em; height: auto; min-height: 100%; }

/* The light: three slow clouds of colour behind everything, and a fine grain
   over them so the dark reads as film, not flat paint. */
body::before {
  content: ""; position: fixed; inset: -20vmax; z-index: -2; pointer-events: none;
  background:
    radial-gradient(38vmax 30vmax at 18% 22%, color-mix(in srgb, var(--glow-b) 30%, transparent), transparent 70%),
    radial-gradient(34vmax 26vmax at 82% 18%, color-mix(in srgb, var(--glow-a) 22%, transparent), transparent 70%),
    radial-gradient(40vmax 32vmax at 60% 92%, color-mix(in srgb, var(--glow-c) 18%, transparent), transparent 72%);
  filter: saturate(120%); opacity: .55; animation: aurora 48s cubic-bezier(.45, 0, .55, 1) infinite alternate;
}

/* The constellation: a core of light, an orbit, stars, and comets. */
.stage-svg.constellation { max-height: 420px; }
.stage-star { fill: #fff; opacity: .35; animation: twinkle 3.2s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .12; } to { opacity: .7; } }
.stage-orbit { fill: none; stroke: color-mix(in srgb, var(--glow-b) 30%, transparent); stroke-width: 1; stroke-dasharray: 2 7; transform-origin: center; transform-box: fill-box; animation: orbit 90s linear infinite; }
.stage-orbit.inner { stroke: color-mix(in srgb, var(--glow-c) 26%, transparent); animation-duration: 60s; animation-direction: reverse; }
@keyframes orbit { to { transform: rotate(360deg); } }
.stage-core .core-halo { fill: color-mix(in srgb, var(--glow-a) 10%, transparent); stroke: none; filter: blur(8px); animation: breathe 4.8s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
.stage-core .core-ring { fill: none; stroke: color-mix(in srgb, var(--glow-a) 70%, transparent); stroke-width: 1.5; stroke-dasharray: 6 5; transform-origin: center; transform-box: fill-box; animation: orbit 24s linear infinite; }
.stage-core .core-body { fill: color-mix(in srgb, var(--glow-a) 16%, #0b0c14) !important; stroke: var(--glow-a) !important; }
.stage-core.lit .core-body, .stage-core.done .core-body { filter: drop-shadow(0 0 18px var(--glow-a)) !important; }
.stage-core .core-label { font-size: 13px; }
@keyframes breathe { from { transform: scale(.94); opacity: .7; } to { transform: scale(1.08); opacity: 1; } }
.stage-tail { filter: none !important; }
@media (prefers-reduced-motion: reduce) { .stage-star, .stage-orbit, .core-halo, .core-ring { animation: none !important; } }
.nebula { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; transition: opacity .8s; }
body.has-nebula::before { display: none; }
.grain { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .06; mix-blend-mode: overlay; width: 100vw; height: 100vh; }
@keyframes aurora { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 50% { transform: translate3d(-3vmax, 2vmax, 0) rotate(8deg); } 100% { transform: translate3d(3vmax, -2vmax, 0) rotate(-6deg); } }

/* A soft light that follows the pointer across the stage. */
.spot { position: fixed; z-index: -1; width: 560px; height: 560px; left: 0; top: 0; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--glow-a) 16%, transparent), transparent); transition: opacity .6s var(--settle); will-change: transform; }
body.lit .spot { opacity: 1; }

/* The rail: a glass column with a lit pill that glides to the open view. */
aside.rail { background: var(--rail); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); border-right: 1px solid var(--glass-edge); }
#nav { position: relative; }
.nav { position: relative; z-index: 1; border-radius: 12px; transition: color .25s var(--settle), transform .35s var(--settle); }
.nav:hover { transform: translateX(3px); }
.nav.on { background: transparent !important; color: var(--ink); }
.nav.on::before { display: none; }
.nav-pill { position: absolute; left: 0; right: 0; top: 0; height: 36px; z-index: 0; border-radius: 12px; pointer-events: none;
  background: linear-gradient(135deg, color-mix(in srgb, var(--glow-a) 26%, transparent), color-mix(in srgb, var(--glow-b) 22%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--glow-a) 40%, transparent), 0 8px 30px -12px var(--glow-a);
  transition: transform .55s var(--settle), height .55s var(--settle), opacity .3s; }
.brand { letter-spacing: .02em; }
.brand small { background: linear-gradient(90deg, var(--glow-a), var(--glow-b)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }

/* Glass for every panel and card, an edge that catches the light, and a
   bloom behind the one under the pointer. */
.card, .panel, .box, .stage-wrap, .chat, .step .body, .ment, .jump {
  background: var(--glass) !important; backdrop-filter: blur(16px) saturate(130%); -webkit-backdrop-filter: blur(16px) saturate(130%);
  border: 1px solid var(--glass-edge) !important; }
.card { position: relative; border-radius: 18px !important; transform-style: preserve-3d; transition: transform .5s var(--settle), box-shadow .5s var(--settle), border-color .3s; will-change: transform; }
.card::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s var(--settle);
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--glow-a) 22%, transparent), transparent 45%); }
.card:hover { box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .7), 0 0 0 1px color-mix(in srgb, var(--glow-a) 35%, transparent); }
.card:hover::after { opacity: 1; }
button, .btn { transition: transform .35s var(--settle), box-shadow .35s var(--settle), filter .25s; position: relative; overflow: hidden; }
button:hover, .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 26px -14px var(--glow-a); }
button:active, .btn:active { transform: translateY(0) scale(.98); }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; width: 10px; height: 10px; margin: -5px 0 0 -5px;
  background: color-mix(in srgb, #fff 55%, transparent); transform: scale(0); opacity: .5; animation: ripple .7s var(--settle) forwards; }
@keyframes ripple { to { transform: scale(40); opacity: 0; } }

/* Titles: large, set in the serif, with one pass of light across them as
   they arrive. */
main h1 { font-family: "EB Garamond", Georgia, serif; font-weight: 600; font-size: clamp(30px, 3.4vw, 46px); letter-spacing: -.01em; line-height: 1.05;
  background: linear-gradient(100deg, var(--ink) 0%, var(--ink) 40%, var(--glow-a) 50%, var(--ink) 60%, var(--ink) 100%); background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: sweep 1.6s .25s var(--settle) both; }
@keyframes sweep { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* Arrival: each part of a new view rises into place in an overlapping wave,
   and the view before it hands over with a short blur. */
.arrive { animation: arrive .7s var(--settle) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes arrive { from { opacity: 0; transform: translate3d(0, 26px, 0) scale(.985); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
main.leaving > * { animation: leave .18s cubic-bezier(.4, 0, 1, 1) forwards; }
@keyframes leave { to { opacity: 0; transform: translate3d(0, -8px, 0) scale(.99); filter: blur(4px); } }
main > *, .grid > .card, .map > * { animation: none; }

/* The live run: lights that glow, lines that shine. */
.stage-line { stroke: color-mix(in srgb, var(--glow-c) 35%, transparent) !important; }
.stage-light { filter: drop-shadow(0 0 7px currentColor) drop-shadow(0 0 14px currentColor) !important; }
.stage-node.lit .stage-box { filter: drop-shadow(0 0 12px color-mix(in srgb, var(--glow-a) 70%, transparent)) !important; }
.live .step.running > .num { box-shadow: 0 0 0 0 var(--accent), 0 0 24px var(--accent); }

/* The opening: the mark and the name, once a visit, then the stage. */
.intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #141725, #05060a 70%); cursor: pointer; }
.intro .lock { display: grid; place-items: center; gap: 18px; }
.intro .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; opacity: 0; transform: scale(.6);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--glow-a) 45%, transparent), color-mix(in srgb, var(--glow-b) 25%, transparent) 55%, transparent);
  animation: bloom 1.4s .2s var(--settle) forwards; }
@keyframes bloom { to { opacity: .45; transform: scale(1); } }
.intro .seal { width: 150px; height: 150px; position: relative; z-index: 1; }
.intro .seal svg { width: 100%; height: 100%; overflow: visible; }

/* ==========================================================================
   Skins: three looks from LemoLab's film-style library, chosen in the rail.
   Hologram HUD: one hue of light on near-black, hairlines, corner brackets,
   a dot grid, numbers that glow. Swiss Motion: paper, ink, one signal red,
   a strict grid, giant type, no glow at all. Spy Titles: cut paper in four
   inks, jaunty type, pieces that cast small paper shadows.
   ========================================================================== */

/* --- Hologram HUD ------------------------------------------------------- */
:root[data-skin="hologram"] {

  --mem: #4fd8ff; --mem-soft: rgba(79, 216, 255, .1); --warn: #ffb547; --warn-soft: rgba(255, 181, 71, .12); --code: #9fd9e8; --code-soft: rgba(79, 216, 255, .06);
  --glass: rgba(3, 16, 24, .58); --glass-edge: rgba(79, 216, 255, .28); --glow-a: #4fd8ff; --glow-b: #2a8fb0; --glow-c: #9ff0ff;

  mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 85%); -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 85%); }

/* --- Spy Titles --------------------------------------------------------- */
:root[data-skin="spy"] {
  --hot: #d23a22; --mustard: #e2a52a; --cream: #efe4c9; --black: #1b1714;

  --accent: #d23a22; --accent-soft: rgba(210, 58, 34, .14); --ok: #1b1714; --ok-soft: rgba(226, 165, 42, .3); --warn: #b07d14; --warn-soft: rgba(226, 165, 42, .25);
  --think: #1b1714; --think-soft: rgba(27, 23, 20, .1); --mem: #1b1714; --mem-soft: rgba(226, 165, 42, .3); --code: #1b1714; --code-soft: rgba(27, 23, 20, .06);

  background: linear-gradient(118deg, transparent 0 58%, var(--mustard) 58% 71%, transparent 71%), linear-gradient(118deg, transparent 0 73%, var(--hot) 73% 79%, transparent 79%); }

[data-skin="spy"] main h1 { font-family: Figtree, sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(54px, 6.4vw, 104px); line-height: .9;

  backdrop-filter: none !important; border-radius: 0 !important; border: 0 !important; background: var(--panel) !important; box-shadow: 4px 5px 0 rgba(27, 23, 20, .28), 0 0 0 2.4px var(--cream) !important;
  clip-path: polygon(0 1.2%, 99.4% 0, 100% 98.8%, .6% 100%); }

[data-skin="spy"] button, [data-skin="spy"] .btn { border-radius: 0 !important; background: var(--hot) !important; color: var(--cream) !important; font-weight: 900; font-style: italic; text-transform: uppercase; box-shadow: 4px 4px 0 var(--black) !important; }
[data-skin="spy"] .stage-svg.constellation .stage-star { fill: var(--black); }
[data-skin="spy"] .stage-orbit { stroke: var(--black); stroke-dasharray: 10 6; }

/* ==========================================================================
   The Agency: Spy Titles taken from a skin to a whole concept. Agents are
   operatives with case files, the rail is a stack of folder tabs, every
   change of view is a brass stab of paper slashing across the screen, the
   credits roll along the top, and while a mission runs an agent in a hat
   and coat runs along the bottom. Only in the Spy Titles look.
   ========================================================================== */
:root:not([data-skin="spy"]) .spy-only { display: none !important; }
[data-skin="spy"] body { grid-template-columns: 236px minmax(0, 1fr); }

/* Folder tabs. */
[data-skin="spy"] #nav { display: flex; flex-direction: column; gap: 6px; padding-right: 0; }
[data-skin="spy"] .nav { margin-right: -10px; padding: 9px 14px 9px 16px; background: #2a241f; color: #efe4c9 !important; clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); transition: transform .35s var(--settle), background .2s; }
[data-skin="spy"] .nav:nth-child(3n+2) { background: #3a2f27; } [data-skin="spy"] .nav:nth-child(3n) { background: #241e1a; }
[data-skin="spy"] .nav:hover { transform: translateX(6px); }
[data-skin="spy"] .nav.on { background: #d23a22 !important; transform: translateX(14px); color: #efe4c9 !important; }
[data-skin="spy"] .nav-pill { display: none; }
[data-skin="spy"] .nav svg { stroke: currentColor; }

/* The credits roll. */
.spy-marquee { position: sticky; top: 0; z-index: 5; margin: -26px -32px 26px; height: 34px; overflow: hidden; background: #1b1714; color: #efe4c9; border-bottom: 3px solid #e2a52a; }
.spy-marquee span { position: absolute; white-space: nowrap; top: 8px; left: 0; font: 900 italic 14px/1 Figtree, sans-serif; letter-spacing: .32em; text-transform: uppercase; animation: credits 38s linear infinite; }
.spy-marquee b { color: #e2a52a; font-weight: 900; } .spy-marquee em { color: #d23a22; font-style: normal; }
@keyframes credits { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }

/* Titles built from paper tiles. */
[data-skin="spy"] main h1.tiled { text-shadow: none; transform: rotate(-3deg); display: flex; flex-wrap: wrap; gap: 4px; animation: none; }
.tile { display: inline-block; padding: .02em .1em .06em; background: #1b1714; color: #efe4c9; box-shadow: 4px 4px 0 rgba(27, 23, 20, .3); -webkit-text-fill-color: #efe4c9;
  animation: tile .5s var(--settle) both; animation-delay: calc(var(--i) * 45ms); clip-path: polygon(2% 3%, 98% 0, 100% 96%, 0 100%); }
.tile:nth-child(3n+1) { background: #d23a22; } .tile:nth-child(4n+2) { background: #e2a52a; color: #1b1714; -webkit-text-fill-color: #1b1714; }
.tile:nth-child(5n) { transform: rotate(4deg); } .tile:nth-child(7n+3) { transform: translateY(-.08em) rotate(-3deg); }
.tile.space { background: none !important; box-shadow: none; width: .25em; }
@keyframes tile { from { opacity: 0; transform: translate3d(0, -60px, 0) rotate(-14deg) scale(1.3); } }

/* Case files. */
.file-strip { margin: -12px -14px 10px; padding: 7px 14px; background: #1b1714; color: #efe4c9; font: 700 10.5px/1 ui-monospace, "Cascadia Code", Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; display: flex; justify-content: space-between; }
.file-strip b { color: #e2a52a; }
.stamp { position: absolute; right: 12px; bottom: 14px; padding: 6px 10px 5px; border: 3px solid currentColor; color: #d23a22; font: 900 15px/1 Figtree, sans-serif; letter-spacing: .14em; text-transform: uppercase;
  transform: rotate(-12deg); opacity: .82; mix-blend-mode: multiply; animation: stampit .45s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: calc(.35s + var(--i, 0) * 70ms); pointer-events: none; }
.stamp.care { color: #1b1714; border-style: double; border-width: 5px; }
@keyframes stampit { from { opacity: 0; transform: rotate(-12deg) scale(2.4); } to { opacity: .82; transform: rotate(-12deg) scale(1); } }
.clip-mark { position: absolute; top: -10px; right: 26px; width: 16px; height: 46px; border: 3px solid #8b8478; border-radius: 9px; border-bottom-color: transparent; transform: rotate(8deg); pointer-events: none; }
[data-skin="spy"] .grid > .card:nth-child(3n+2) .file-strip { background: #d23a22; }
[data-skin="spy"] .grid > .card:nth-child(3n+2) .stamp { mix-blend-mode: normal; color: #e2a52a; }
.file-strip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62%; }
[data-skin="spy"] .grid > .card { overflow: visible; padding-bottom: 46px; }

/* The brass stab: three slabs of paper slash across, and the view is cut. */
.stab { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; }
.stab i { position: absolute; left: -30%; width: 160%; height: 46%; transform-origin: center; transform: rotate(-24deg) translate3d(-110%, 0, 0); animation: slash .62s cubic-bezier(.85, 0, .15, 1) forwards; }
.stab i:nth-child(1) { top: -6%; background: #d23a22; }
.stab i:nth-child(2) { top: 28%; background: #1b1714; animation-delay: .05s; }
.stab i:nth-child(3) { top: 62%; background: #e2a52a; animation-delay: .1s; }
@keyframes slash { 0% { transform: rotate(-24deg) translate3d(-110%, 0, 0); } 45%, 55% { transform: rotate(-24deg) translate3d(0, 0, 0); } 100% { transform: rotate(-24deg) translate3d(110%, 0, 0); } }
[data-skin="spy"] .arrive { animation-name: lateral; }
@keyframes lateral { from { opacity: 0; transform: translate3d(-80px, 0, 0); } to { opacity: 1; transform: none; } }

/* The agent on a mission. */
.runner { position: fixed; bottom: 10px; left: 260px; z-index: 40; width: 98px; height: 134px; pointer-events: none; opacity: 0; transition: opacity .3s; }
body.on-mission .runner { opacity: 1; animation: dash 6s linear infinite; }
@keyframes dash { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(calc(100vw - 340px), 0, 0); } }
.runner .leg, .runner .arm { transform-box: fill-box; transform-origin: 50% 0; }
body.on-mission .runner .leg.a, body.on-mission .runner .arm.b { animation: stride .42s ease-in-out infinite alternate; }
body.on-mission .runner .leg.b, body.on-mission .runner .arm.a { animation: stride .42s ease-in-out infinite alternate-reverse; }
@keyframes stride { from { transform: rotate(-32deg); } to { transform: rotate(32deg); } }
.runner .scarf { transform-box: fill-box; transform-origin: 0 50%; }
body.on-mission .runner .scarf { animation: flap .2s ease-in-out infinite alternate; }
@keyframes flap { from { transform: rotate(-6deg) scaleX(.9); } to { transform: rotate(8deg) scaleX(1.1); } }
.track { position: fixed; bottom: 8px; left: 236px; right: 0; height: 3px; z-index: 39; background: repeating-linear-gradient(90deg, #1b1714 0 18px, transparent 18px 30px); opacity: 0; transition: opacity .3s; pointer-events: none; }
body.on-mission .track { opacity: .5; }
@media (prefers-reduced-motion: reduce) { .stab, .runner { display: none !important; } .spy-marquee span { animation: none; } .tile, .stamp { animation: none; } }
[data-skin="spy"] .untiled { display: none; }
</style>
</head>
<body>
<aside class="rail">
  <div class="brand"><span class="mark" id="mark">K</span><span>Kosika <small>Studio</small></span></div>
  <div id="nav"></div>
  <div class="foot" id="foot"></div>
</aside>
<main id="main"></main>
<template id="icon-assistant"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></template>
<template id="icon-project"><svg viewBox="0 0 24 24"><path d="M4 5h6v6H4z"/><path d="M14 5h6v6h-6z"/><path d="M4 15h6v4H4z"/><path d="M14 15h6v4h-6z"/></svg></template>
<template id="icon-agents"><svg viewBox="0 0 24 24"><path d="M9 7h6a4 4 0 0 1 4 4v5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-5a4 4 0 0 1 4-4z"/><path d="M12 3v4"/><path d="M9.5 13h.01"/><path d="M14.5 13h.01"/></svg></template>
<template id="icon-runs"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg></template>
<template id="icon-tools"><svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.300 5.300L3 18l3 3 6.200-6.200a4 4 0 0 0 5.300-5.300l-2.500 2.500-2.500-2.500 2.500-2.500z"/></svg></template>
<template id="icon-skills"><svg viewBox="0 0 24 24"><path d="M12 3l2.600 5.400L20 9.300l-4 4 1 5.700-5-2.700L7 19l1-5.700-4-4 5.400-.900L12 3z"/></svg></template>
<template id="icon-permissions"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.800-1-8-4.500-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg></template>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const main = document.getElementById("main");
let overview = null;
// A request on its way to the agent that was chosen for it.
let handed = null;
// Whether the assistant has said hello since the page was opened.
let greeted = false;

// Speaking answers aloud. Only a voice that lives on this computer is used:
// a voice marked as a network service would send the words away to be
// spoken, and those are never picked. The choice is kept in this browser.
const canSpeak = "speechSynthesis" in window;
function speaking() { try { return localStorage.getItem("kosika-speak") === "on"; } catch (error) { return false; } }
function setSpeaking(on) { try { localStorage.setItem("kosika-speak", on ? "on" : "off"); } catch (error) { /* lasts until the page closes */ } if (!on && canSpeak) speechSynthesis.cancel(); }
function localVoice() {
  const voices = speechSynthesis.getVoices().filter(voice => voice.localService);
  return voices.find(voice => voice.lang === "en-GB") || voices.find(voice => voice.lang.startsWith("en")) || voices[0] || null;
}
function speak(text) {
  if (!canSpeak || !speaking() || !text) return false;
  const voice = localVoice();
  if (!voice) return false;
  speechSynthesis.cancel();
  // Lists are read as sentences, and nothing over a minute or so is read.
  const said = new SpeechSynthesisUtterance(text.replace(/\n+/g, ". ").slice(0, 900));
  said.voice = voice; said.lang = voice.lang; said.rate = 1.02;
  return said;
}
// Says something, and tells `ended` when it has finished or could not start.
function sayAloud(text, ended) {
  const said = speak(text);
  if (!said) { if (ended) ended(false); return false; }
  said.onend = said.onerror = () => { if (ended) ended(true); };
  speechSynthesis.speak(said);
  return true;
}
if (canSpeak) speechSynthesis.getVoices();

// Every piece of text reaches the page through textContent, never as markup.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === false || value == null) continue;
    if (key === "class") el.className = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value);
  }
  for (const kid of kids.flat(3)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const chip = (text, kind) => h("span", {class: "chip " + (kind || "")}, text);
const sleep = ms => new Promise(done => setTimeout(done, ms));
// replaceChildren and append would print a missing piece as the word "null".
const fill = (el, ...kids) => { el.replaceChildren(...kids.flat().filter(kid => kid != null && kid !== false)); return el; };
const icon = name => document.getElementById("icon-" + name).content.cloneNode(true);

// The readable part of an answer that is still being written. A model step
// answers with one JSON object; this pulls out its first piece of text.
function partial(raw) {
  const open = raw.match(/^\s*\{\s*"[^"]*"\s*:\s*"/);
  if (!open) return "";
  const body = raw.slice(open[0].length);
  let out = "";
  for (let i = 0; i < body.length; i++) {
    const c = body[i];
    if (c === '"') break;
    if (c !== "\\") { out += c; continue; }
    if (i + 1 >= body.length) break;
    const next = body[++i];
    if (next === "u") { if (i + 4 >= body.length) break; out += String.fromCharCode(parseInt(body.slice(i + 1, i + 5), 16)); i += 4; }
    else out += next === "n" ? "\n" : next === "t" ? "\t" : next === "r" ? "" : next;
  }
  return out;
}

// What an agent is asking to be allowed to do, in words.
const isProgram = request => request.kind === "system:shell";
const askTitle = request => (request.handed ? "This was handed to " + request.handed + ", which asks: " : "") + askWants(request);
const askWants = request => request.plan ? "Wants to carry out this plan of " + request.plan.length + (request.plan.length === 1 ? " change" : " changes") + ", in this order, and nothing else:" : isProgram(request) ? "Wants to start this program, and nothing else:" : "Wants to do this, and nothing else: " + (request.tool || "an action");
function askLines(request) {
  if (request.plan) {
    const steps = request.plan.map((step, at) => (at + 1) + ". " + (isProgram(step) ? "start a program\n" : step.tool + "\n") + askLines(step).split("\n\n")[0].split("\n").map(line => "     " + line).join("\n"));
    const warned = (request.warnings || []).length ? "\n\nBefore you say yes, this plan was checked and something is wrong:\n" + request.warnings.map(line => "  ! " + line).join("\n") : "";
    return steps.join("\n\n") + warned + "\n\nOne yes covers exactly these, with exactly these details. If one fails, the ones after it do not happen." + (request.walled ? "\nThey happen in the session's copy, not in your folder." : "");
  }
  const given = request.arguments || {};
  if (request.kind === "system:files" && request.operation === "write_all" && Array.isArray(given.files)) {
    // Several whole files in one step: each with whether it is new, and
    // how its length changes, then the new text of each.
    const count = text => text ? text.split("\n").length - (text.endsWith("\n") ? 1 : 0) : 0;
    const head = given.files.map((file, at) => (at + 1) + ". " + file.path + (file.exists ? ": " + count(file.before) + " lines become " + count(file.text) : ": new, " + count(file.text) + " lines"));
    const body = given.files.map(file => "----- " + file.path + " -----\n" + file.text);
    const note = given.note ? given.note + "\n\n" : "";
    return note + head.join("\n") + "\n\nOne yes writes exactly these files, with exactly this text.\n\n" + body.join("\n\n");
  }
  if (isProgram(request)) {
    const words = (given.args || []).map(word => /[\s"]/.test(word) || word === "" ? JSON.stringify(word) : word);
    return [request.operation, ...words].join(" ") + "\n\nIt runs inside the granted folder and is stopped after 60 seconds.";
  }
  const lines = Object.entries(given).filter(([key, value]) => value != null).map(([key, value]) => key + ": " + (typeof value === "string" ? value : JSON.stringify(value)));
  if (request.kind && !request.kind.includes(":")) lines.push("", "This goes to the MCP server " + request.kind + ".");
  return lines.join("\n");
}

async function api(path, options) {
  const response = await fetch(path, {...(options || {}), headers: {"X-Kosika-Token": token, "Content-Type": "application/json"}});
  const data = await response.json().catch(() => ({error: "The app gave an unreadable answer."}));
  if (!response.ok) throw new Error(data.error || "Request failed");
  return data;
}

// Light, dark, or whatever the computer is set to. The choice is kept in
// this browser; nothing is sent anywhere.
const THEMES = ["system", "light", "dark"], THEME_WORDS = {system: "as your computer", light: "light", dark: "dark"};
function theme() { try { const kept = localStorage.getItem("kosika-theme"); return THEMES.includes(kept) ? kept : "system"; } catch (error) { return "system"; } }
function setTheme(name) {
  if (name === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", name);
  try { localStorage.setItem("kosika-theme", name); } catch (error) { /* the choice lasts until the page closes */ }
}
setTheme(theme());

// Jump anywhere: one box over every page, agent, workflow, model, tool,
// memory and record. Ctrl+K opens it; Enter goes; Escape closes.
let jumpItems = null;
async function openJump() {
  if (document.querySelector(".veil")) return;
  const pages = [["assistant", "Assistant"], ["project", "Project"], ["agents", "Agents"], ["runs", "Runs"], ["tools", "Tools"], ["skills", "Skills"], ["permissions", "Permissions"]].map(([view, name]) => ({kind: "page", name, detail: "", title: "Studio", view}));
  const box = h("input", {type: "text", placeholder: "Jump to an agent, workflow, model, tool, memory or record"}), found = h("div", {class: "found"});
  const veil = h("div", {class: "veil", onclick: event => { if (event.target === veil) close(); }}, h("div", {class: "jump"}, box, found, h("div", {class: "keys"}, "↑ ↓ to move · Enter to open · Esc to close")));
  let hits = [], at = 0;
  function close() { veil.remove(); }
  function open(item) { close(); if (item.kind === "page") go(item.view); else go("agent", item.agent); }
  function draw() {
    const words = box.value.toLowerCase().split(/\s+/).filter(Boolean);
    hits = [...pages, ...(jumpItems || [])].filter(item => words.every(word => (item.name + " " + item.kind + " " + item.title + " " + item.detail).toLowerCase().includes(word))).slice(0, 40);
    at = Math.min(at, Math.max(0, hits.length - 1));
    fill(found, hits.length ? hits.map((item, index) => h("div", {class: "hit" + (index === at ? " on" : ""), onclick: () => open(item), onmousemove: () => { if (at !== index) { at = index; draw(); } }},
      chip(item.kind, KIND_CHIP[item.kind] || ""), h("b", null, item.name), h("span", null, item.detail), h("small", null, item.kind === "page" ? "" : item.title))) : h("div", {class: "empty", style: "padding:14px"}, jumpItems ? "Nothing matches." : "Reading every program…"));
    const on = found.querySelector(".hit.on"); if (on) on.scrollIntoView({block: "nearest"});
  }
  box.addEventListener("input", () => { at = 0; draw(); });
  box.addEventListener("keydown", event => {
    if (event.key === "Escape") close();
    else if (event.key === "ArrowDown") { event.preventDefault(); at = Math.min(at + 1, hits.length - 1); draw(); }
    else if (event.key === "ArrowUp") { event.preventDefault(); at = Math.max(at - 1, 0); draw(); }
    else if (event.key === "Enter" && hits[at]) open(hits[at]);
  });
  document.body.append(veil); box.focus(); draw();
  if (!jumpItems) { try { jumpItems = (await api("/api/project")).items; } catch (error) { jumpItems = []; } if (veil.isConnected) draw(); }
}
window.addEventListener("keydown", event => { if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openJump(); } });
// What is in the folder may have changed by the next time the box is opened.
window.addEventListener("hashchange", () => { jumpItems = null; });

// Studio's own moving mark. The app runs a Kosika program that describes
// it and sends the picture; until then, and if that fails, a plain K.
let brandSvg = null;
const stillness = window.matchMedia("(prefers-reduced-motion: reduce)");
function brandMark() {
  if (!brandSvg) return null;
  const copy = brandSvg.cloneNode(true);
  // Someone who asked their computer for less motion gets the finished mark, still.
  if (stillness.matches) queueMicrotask(() => { try { copy.setCurrentTime(1.9); copy.pauseAnimations(); } catch (error) { /* drawn but not yet in the page */ } });
  return copy;
}
function titled(text) { const mark = brandMark(); return mark ? h("div", {class: "titled"}, h("div", {class: "hero"}, mark), h("h1", null, text)) : h("h1", null, text); }
async function loadBrand() {
  try {
    const brand = await api("/api/brand"); if (!brand.ok) return;
    const parsed = new DOMParser().parseFromString(brand.svg, "image/svg+xml");
    brandSvg = document.importNode(parsed.documentElement, true); brandSvg.removeAttribute("width"); brandSvg.removeAttribute("height");
    const holder = document.getElementById("mark"); holder.classList.add("moving"); fill(holder, brandMark());
  } catch (error) { /* the plain K stays */ }
}

function go(view, id) { location.hash = "#" + view + (id ? "/" + encodeURIComponent(id) : ""); }
window.addEventListener("hashchange", route);

function drawRail(active) {
  const items = [["assistant", "Assistant"], ["project", "Project"], ["agents", "Agents"], ["runs", "Runs"], ["tools", "Tools"], ["skills", "Skills"], ["permissions", "Permissions"]];
  document.getElementById("nav").replaceChildren(...items.map(([key, label]) =>
    h("div", {class: "nav" + (key === active ? " on" : ""), onclick: () => go(key)}, icon(key), label)));
  document.getElementById("foot").replaceChildren(
    h("div", null, h("span", {class: "dot" + (overview.can_run ? "" : " off")}), overview.can_run ? overview.model : "no model: view and test only"),
    h("div", {class: "path", title: overview.root}, overview.root.split(/[\\/]/).slice(-2).join("/")),
    h("div", {class: "theme", title: "Jump to any agent, workflow, tool or record", onclick: openJump}, h("span", null, "Jump to…"), h("small", {style: "margin-left:auto;color:var(--faint)"}, "Ctrl K")),
    h("div", {class: "theme", title: "Change between your computer's setting, light and dark", onclick: () => { setTheme(THEMES[(THEMES.indexOf(theme()) + 1) % THEMES.length]); drawRail(active); }}, h("i"), "Theme: " + THEME_WORDS[theme()]));
}

let routing = 0;
async function route() {
  const mine = ++routing;
  const [view, rawId] = location.hash.slice(1).split("/");
  const id = rawId ? decodeURIComponent(rawId) : "";
  try {
    overview = await api("/api/agents");
    if (mine !== routing) return;
    const active = view || "assistant";
    drawRail(active === "agent" ? "agents" : active);
    if (active === "agents") showAgents();
    else if (active === "agent") await showAgent(id, false);
    else if (active === "project") await showProject();
    else if (active === "runs") await showRuns();
    else if (active === "tools") await showTools();
    else if (active === "skills") await showSkills();
    else if (active === "permissions") showPermissions();
    else if (overview.assistant) await showAgent(overview.assistant, true);
    else showAgents();
  } catch (error) {
    main.replaceChildren(h("div", {class: "banner bad"}, String(error.message || error)));
  }
}

function badges(agent) {
  if (agent.error) return [chip("does not check", "bad")];
  const out = [];
  for (const model of agent.models) out.push(chip("model " + model, "think"));
  for (const memory of agent.memories) out.push(chip("remembers " + memory.name, "mem"));
  for (const board of agent.boards || []) out.push(chip("board " + board.name, "accent"));
  if (agent.tools.length) out.push(chip(agent.tools.length + " tool" + (agent.tools.length > 1 ? "s" : ""), agent.changes_world ? "warn" : ""));
  if (agent.changes_world) out.push(chip("asks before changing things", "warn"));
  if (agent.swarms.length) out.push(chip("swarm", "accent"));
  if (agent.tests) out.push(chip(agent.tests + " test" + (agent.tests > 1 ? "s" : ""), "ok"));
  if (agent.chat) out.push(chip("chat", "accent"));
  return out;
}

// The Project page: everything in the folder in one list, searchable, and
// suggestions that come from rules applied to the checked programs.
const KIND_ORDER = ["agent", "workflow", "model", "tool", "memory", "board", "swarm", "record"];
const KIND_LABEL = {agent: "Agents", workflow: "Workflows", model: "Models", tool: "Tools", memory: "Memories", board: "Boards", swarm: "Swarms", record: "Data records"};
const KIND_CHIP = {agent: "accent", workflow: "", model: "think", tool: "warn", memory: "mem", board: "accent", swarm: "accent", record: "ok"};
async function showProject() {
  main.replaceChildren(h("p", {class: "lead"}, h("span", {class: "spin"}), "Reading every program"));
  const project = await api("/api/project");
  const search = h("input", {type: "text", placeholder: "Search every agent, workflow, model, tool, memory and record"});
  const list = h("div"), tally = h("div", {class: "chips", style: "margin:12px 0"});
  let only = "";
  function draw() {
    const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = item => (!only || item.kind === only) && words.every(word => (item.name + " " + item.detail + " " + item.title + " " + item.kind).toLowerCase().includes(word));
    const found = project.items.filter(hit);
    fill(tally, h("span", {class: "chip" + (only ? "" : " accent"), style: "cursor:pointer", onclick: () => { only = ""; draw(); }}, "Everything " + project.items.length),
      KIND_ORDER.filter(kind => project.counts[kind]).map(kind => h("span", {class: "chip " + (only === kind ? "accent" : ""), style: "cursor:pointer", onclick: () => { only = only === kind ? "" : kind; draw(); }}, KIND_LABEL[kind] + " " + project.counts[kind])));
    fill(list, found.length ? KIND_ORDER.filter(kind => found.some(item => item.kind === kind)).map(kind => h("div", {class: "panel", style: "margin-bottom:12px"}, h("h4", null, KIND_LABEL[kind]),
      found.filter(item => item.kind === kind).slice(0, 200).map(item => h("div", {class: "item", style: "cursor:pointer", onclick: () => go("agent", item.agent)},
        h("span", {class: "from"}, item.title + (item.line ? ", line " + item.line : "")), h("b", null, item.name), " ", h("span", {class: "small", style: "display:inline"}, item.detail))))) : h("div", {class: "empty"}, "Nothing matches."));
  }
  search.addEventListener("input", draw);
  const must = project.suggestions.filter(s => s.must), could = project.suggestions.filter(s => !s.must);
  const advice = s => h("div", {class: "item", style: "cursor:pointer", onclick: () => go("agent", s.agent)}, h("span", {class: "from"}, "rule: " + s.rule + (s.line ? ", line " + s.line : "")), h("b", null, s.title), " ", s.text);
  fill(main, titled("Project"),
    h("p", {class: "lead"}, "Everything in this folder, in one place. Click anything to open the agent it belongs to."),
    h("div", {class: "map"},
      must.length ? h("div", {class: "panel"}, h("h4", null, "To fix"), must.map(advice)) : null,
      h("div", {class: "panel"}, h("h4", null, "Suggestions"), could.length ? could.map(advice) : h("div", {class: "empty"}, "None. Every rule is satisfied."),
        h("div", {class: "foot", style: "margin-top:8px"}, "Each suggestion comes from a rule applied to the checked program, never from a model. Ignore any that does not fit.")),
      h("div", null, search, tally, list)));
  draw();
}

function showAgents() {
  const agents = overview.agents;
  main.replaceChildren(
    titled("Agents"),
    h("p", {class: "lead"}, agents.length ? agents.length + " programs in this folder. Open one to watch it work, test it, and see what it is made of." : "No Kosika programs with a main workflow were found in this folder."),
    h("div", {class: "grid"}, agents.map(agent => h("div", {class: "card", onclick: () => go("agent", agent.id)},
      h("h3", null, agent.title),
      h("div", {class: "about"}, agent.error ? agent.error : (agent.about || "No description. Add a // comment at the top of the file.")),
      h("div", {class: "chips"}, badges(agent)), h("div", {class: "path"}, agent.path))), newAgentCard()));
}

function newAgentCard() {
  const words = {support: "Support desk: sorts a message and drafts a reply", expense: "Expense checker: reads a receipt, code applies the rules", notes: "Meeting notes: summary, decisions and actions"};
  const name = h("input", {type: "text", placeholder: "name, for example my_helper"});
  const kind = h("select", null, (overview.starters || []).map(item => h("option", {value: item}, words[item] || item)));
  const out = h("div");
  const make = async () => {
    try { const made = await api("/api/new", {method: "POST", body: JSON.stringify({name: name.value.trim(), kind: kind.value})}); go("agent", made.id); }
    catch (error) { fill(out, h("div", {class: "banner bad", style: "margin:0"}, error.message)); }
  };
  name.addEventListener("keydown", event => { if (event.key === "Enter") make(); });
  return h("div", {class: "card new"}, h("h3", null, "New agent"),
    h("div", {class: "about", style: "min-height:0"}, "Start from a working example with its tests, then change it in the Code tab."),
    name, kind, h("div", null, h("button", {onclick: make}, "Create")), out);
}

const fact = (title, lines, empty) => h("div", {class: "fact"}, h("b", null, title), lines.length ? lines.map(line => h("div", {class: "line"}, line)) : h("div", {class: "line empty"}, empty));

// The MCP servers this Studio was started with, and what each offers.
async function showTools() {
  main.replaceChildren(h("h1", null, "Tools"), h("p", {class: "lead"}, h("span", {class: "spin"}), "Asking the servers what they offer"));
  const head = [h("h1", null, "Tools"),
    h("p", {class: "lead"}, "MCP servers are programs that offer tools: search, files, calendars, databases and many more. An agent may use a server's tool only when you named that server when starting Studio. Copy a tool's text into an agent's Code tab, then add the tool to an agent's can list.")];
  if (!overview.mcp.length) {
    fill(main, head, h("div", {class: "banner warn"}, "No MCP server was granted. Start Studio with --mcp NAME=COMMAND, for example: --mcp notes=\"python notes_server.py\""));
    return;
  }
  const data = await api("/api/mcp");
  fill(main, head, data.servers.map(server => h("div", {class: "panel", style: "margin-bottom:14px"},
    h("div", {class: "wf-title"}, "server " + server.name), h("div", {class: "wf-sub"}, "started with: " + server.command),

const KIND_WORDS = {board: "agents talking", code: "plain code", think: "asks a model", model: "asks a model", memory: "memory", workflow: "runs a workflow", agent: "asks an agent", files: "looks at files", web: "reads the web", tool: "uses a tool"};

  if (call.kind === "model") return "ask model " + call.text;
  if (call.kind === "memory") return call.text.replace(/^recall /, "look up in memory ").replace(/^remember /, "save to memory ");
  if (call.kind === "board") return call.text.replace(/^read /, "read board ");
  if (call.kind === "workflow") return "run workflow " + call.text;
  if (call.kind === "agent") return "ask agent " + call.text;
  if (call.kind === "web") return "read a web page (allowed sites only)";
  if (call.kind === "files" || call.kind === "tool") return "tool " + call.text + (call.changes ? " (asks you first)" : " (read-only)");

}

// Draws one workflow. Gives back its element and a map from step name to node.
